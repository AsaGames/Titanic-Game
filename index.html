<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Titanic Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060d1f;
    --glass: rgba(9, 18, 40, 0.78);
    --glass-strong: rgba(10, 20, 44, 0.94);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --muted: #9fb0d0;
    --gold: #e8c15a;
    --gold-deep: #a9811f;
    --danger: #e5484d;
    --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; position: fixed; inset: 0; }
  #sky, #gl { display: none; }
  body.three #sky, body.three #gl { display: block; }
  svg { display: block; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .panel { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--glass);
    border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
  .stat { display: flex; align-items: center; gap: 7px; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 46px; }
  .stat svg { width: 22px; height: 22px; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  .badge { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
  .badge.c3 { background: linear-gradient(180deg, #d39a66, #9c6438); color: #2a1406; }
  .badge.c2 { background: linear-gradient(180deg, #e9eef3, #aab4bf); color: #1c2530; }
  .badge.c1 { background: linear-gradient(180deg, #f6d77a, #c99a26); color: #2b1d00; }
  .slot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: rgba(255,255,255,0.22);
    border: 1px dashed rgba(255,255,255,0.22); transition: all 0.3s; flex: none; }
  .slot svg { width: 22px; height: 22px; }
  .slot.have { color: var(--gold); border: 1px solid var(--gold); box-shadow: 0 0 14px rgba(232, 193, 90, 0.55); }
  #silverSlot.have { color: #dfe6ee; border-color: #dfe6ee; box-shadow: 0 0 14px rgba(223, 230, 238, 0.5); }
  .slot.item { display: none; border-style: solid; border-color: rgba(255,255,255,0.3); }
  .slot.item.have { display: grid; box-shadow: none; }
  .spacer { flex: 1; }
  .lvl { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .lvl b { font-size: 21px; color: var(--text); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  #fsBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #fsBtn svg { width: 22px; height: 22px; }
  #fsBtn[hidden] { display: none; }
  #soundBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #soundBtn svg { width: 22px; height: 22px; }

  #msg { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -8px); max-width: min(92vw, 640px);
    display: flex; align-items: center; gap: 12px;
    background: var(--glass-strong); border: 1px solid rgba(232, 193, 90, 0.55); border-radius: 14px; padding: 10px 20px;
    font-size: clamp(17px, 2.6vw, 22px); font-weight: 500; text-align: left; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35); transition: opacity 0.25s, transform 0.25s; opacity: 0; }
  #msg svg { width: 34px; height: 34px; flex: none; }
  #msg.show { opacity: 1; transform: translate(-50%, 0); }
  #warn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
    background: rgba(120, 14, 20, 0.88); border: 1px solid rgba(255, 120, 120, 0.6); color: #fff; border-radius: 12px;
    padding: 8px 16px; font-size: clamp(14px, 2.2vw, 18px); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    pointer-events: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  #warn .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- Touch controls ---------- */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #warn { bottom: auto; top: 118px; }
  .pad { position: fixed; bottom: 18px; display: flex; gap: 12px; align-items: flex-end; }
  #padL { left: 18px; }
  #padR { right: 18px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .tbtn { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: rgba(9, 18, 40, 0.62); border: 1.5px solid rgba(255,255,255,0.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tbtn svg { width: 30px; height: 30px; }
  .tbtn.on { background: rgba(232, 193, 90, 0.85); color: #1f1600; }
  #btnSearch { width: 82px; height: 82px; border-color: var(--gold); color: var(--gold); }
  #btnSearch.on { color: #1f1600; }

  /* ---------- Screens ---------- */
  #screen { position: fixed; inset: 0; display: flex; padding: 16px; touch-action: pan-y;
    background: radial-gradient(ellipse at center, rgba(6, 13, 31, 0.55), rgba(3, 7, 18, 0.9)); overflow-y: auto; }
  #screen.hide { display: none; }
  .card { width: 100%; max-width: 580px; text-align: center; padding: 28px 30px 24px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(20, 36, 72, 0.96), rgba(10, 20, 44, 0.97));
    border: 1px solid rgba(232, 193, 90, 0.35); box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08); margin: auto; }
  .eyebrow { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  .card h1 { margin: 6px 0 8px; font-size: clamp(34px, 7vw, 50px); font-weight: 700; letter-spacing: 0.01em; line-height: 1.05; text-wrap: balance; }
  .card h2 { margin: 10px 0 6px; font-size: clamp(28px, 6vw, 38px); font-weight: 700; text-wrap: balance; }
  .lede { margin: 0 auto 18px; max-width: 430px; color: var(--muted); font-size: 17px; line-height: 1.45; }
  .hero { width: 180px; height: 96px; margin: 0 auto 4px; }
  .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .avatars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0 0 18px; }
  .avatar { width: 62px; height: 74px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,0.05);
    cursor: pointer; padding: 0; display: grid; place-items: center; transition: transform 0.1s; }
  .avatar img { width: 54px; height: 68px; }
  .avatar:hover { transform: translateY(-2px); }
  .avatar[aria-pressed="true"] { border-color: var(--gold); background: rgba(232,193,90,0.15); box-shadow: 0 0 14px rgba(232,193,90,0.4); }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; text-align: left; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); font-size: 15px; line-height: 1.25; }
  .step svg { width: 30px; height: 30px; flex: none; }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .controls span { display: inline-flex; align-items: center; gap: 4px; }
  kbd { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text); min-width: 26px; height: 26px; padding: 0 7px;
    display: inline-grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-bottom-width: 3px; }
  .level-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 18px; color: var(--muted);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
  .level-row b { color: var(--text); font-size: 20px; letter-spacing: 0; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .pip.on { background: var(--gold); box-shadow: 0 0 8px rgba(232,193,90,0.6); }
  .next { display: inline-flex; align-items: center; gap: 8px; margin: -4px auto 18px; padding: 8px 14px; border-radius: 12px;
    background: rgba(232,193,90,0.1); border: 1px solid rgba(232,193,90,0.35); font-size: 15px; color: var(--text); text-align: left; }
  .next svg { width: 24px; height: 24px; flex: none; }
  .saved { display: inline-flex; align-items: center; gap: 10px; margin: 0 auto 16px; font-size: 17px; font-weight: 500; }
  .saved svg { width: 34px; height: 34px; }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary { font-family: var(--font); font-size: 22px; font-weight: 600; letter-spacing: 0.04em; padding: 14px 54px; border-radius: 14px;
    border: none; cursor: pointer; color: #2b1d00; background: linear-gradient(180deg, #f6d77a, #d9a92c);
    box-shadow: 0 6px 0 #9a7417, 0 12px 26px rgba(217, 169, 44, 0.3); transition: transform 0.08s, box-shadow 0.08s; }
  .primary { position: relative; }
  .primary::before { content: ""; position: absolute; left: 18px; right: 18px; top: -7px; height: 7px;
    background-image: linear-gradient(180deg, #f8dc85, #e6b53a); border-radius: 3px 3px 0 0;
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 18px, transparent 18px 30px); mask: repeating-linear-gradient(90deg, #000 0 18px, transparent 18px 30px); }
  .primary:hover { filter: brightness(1.05); }
  .primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a7417; }
  .secondary { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font); font-size: 16px; font-weight: 500;
    padding: 9px 16px; border-radius: 12px; cursor: pointer; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18); }
  .secondary svg { width: 20px; height: 20px; }
  .secondary:hover { background: rgba(255,255,255,0.1); }
  .link { background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 14px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .form { text-align: left; display: flex; flex-direction: column; gap: 20px; margin: 18px 0 22px; }
  .field .lbl { display: block; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field .help { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .field input[type="text"] { width: 100%; font: 500 18px var(--font); color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px 12px; user-select: text; -webkit-user-select: text; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
  .swatch[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,193,90,0.35), inset 0 0 0 1px rgba(0,0,0,0.3); }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
  .seg button { font: 500 15px var(--font); color: var(--text); background: transparent; border: none; padding: 9px 16px; cursor: pointer; }
  .seg button + button { border-left: 1px solid rgba(255,255,255,0.2); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #2b1d00; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.18);
    position: relative; cursor: pointer; flex: none; transition: background 0.2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.2s; }
  .switch input:checked { background: var(--gold); }
  .switch input:checked::after { left: 25px; }
  .stepper { display: inline-flex; align-items: center; gap: 14px; }
  .stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
    color: var(--text); font: 600 22px var(--font); cursor: pointer; }
  .stepper output { font-size: 22px; font-weight: 600; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }

  .wallet { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; margin: 4px 0 14px; }
  .wallet svg { width: 22px; height: 22px; }
  .shop-items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 16px; }
  .shop-item { padding: 16px 12px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .shop-item > svg { width: 58px; height: 58px; }
  .shop-item h3 { margin: 4px 0 0; font-size: 19px; font-weight: 600; }
  .shop-item p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.3; min-height: 36px; }
  .buy { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font: 600 17px var(--font); padding: 8px 18px; border-radius: 10px;
    border: none; cursor: pointer; color: #2b1d00; background: linear-gradient(180deg, #f6d77a, #d9a92c); }
  .buy svg { width: 18px; height: 18px; }
  .buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .buy.owned { background: rgba(91, 209, 139, 0.2); color: #b9f5cf; opacity: 1; }

  @media (max-height: 500px) {
    #msg { top: 62px; font-size: 16px; padding: 7px 14px; max-width: min(60vw, 520px); }
    #msg svg { width: 26px; height: 26px; }
  }
  @media (max-width: 460px) {
    .steps { grid-template-columns: 1fr; }
    .card { padding: 22px 16px 20px; }
    .badge { font-size: 11px; padding: 4px 7px; }
    .panel { padding: 0 10px; gap: 8px; }
    .lvl { display: none; }
    .avatars { gap: 6px; }
    .avatar { width: 46px; height: 58px; border-radius: 12px; }
    .avatar img { width: 40px; height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #warn .dot { animation: none; }
    .primary, .avatar, #msg { transition: none; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div class="stat"><span data-icon="coin"></span><span id="coinCount">0</span></div>
    <div class="sep"></div>
    <div class="badge c3" id="classBadge">3rd Class</div>
    <div class="sep"></div>
    <div class="slot" id="keySlot" data-icon="key" title="Key"></div>
    <div class="slot item" id="silverSlot" data-icon="key" title="Silver key"></div>
    <div class="slot item" id="jacketSlot" data-icon="jacket" title="Life jacket"></div>
    <div class="slot item" id="shoesSlot" data-icon="shoe" title="Fast shoes"></div>
    <div class="slot item" id="dogSlot" data-icon="dog" title="Puppy"></div>
  </div>
  <div class="spacer"></div>
  <div class="panel lvl">Level<b id="levelNum">1</b></div>
  <button class="panel" id="fsBtn" aria-label="Full screen" hidden></button>
  <button class="panel" id="soundBtn" aria-label="Toggle sound"></button>
</div>
<div id="msg"></div>
<div id="warn"><span class="dot"></span>Get to a lifeboat &mdash; don't touch the water</div>

<div id="touch">
  <div class="pad" id="padL">
    <div class="tbtn" data-k="left" data-icon="left"></div>
    <div class="tbtn" data-k="right" data-icon="right"></div>
  </div>
  <div class="pad" id="padR">
    <div class="tbtn" id="btnSearch" data-icon="search"></div>
    <div class="col">
      <div class="tbtn" data-k="up" data-icon="up"></div>
      <div class="tbtn" data-k="down" data-icon="down"></div>
    </div>
  </div>
</div>

<div id="screen"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   THE TITANIC GAME — an adventure designed by Asa (age 6)
   Start at the bottom of the ship. Collect coins to move up a class,
   find the key, unlock the lifeboat gate, and board a lifeboat before
   the water touches you. You either survive or you don't.
   ===================================================================== */

// ---------- Icons (HUD, messages + menus) ----------
const ICONS = {
  coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f2c94c" stroke="#a87912" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#c9971c" stroke-width="1.6"/><path d="M7.5 7.5a6 6 0 0 1 4-2" stroke="#fff6d0" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="7" cy="12" r="4.4"/><path d="M11.4 12h10M17.6 12v4M21 12v3"/></svg>',
  keyGold: '<svg viewBox="0 0 24 24" fill="none" stroke="#e8c15a" stroke-width="2.6" stroke-linecap="round"><circle cx="7" cy="12" r="4.4"/><path d="M11.4 12h10M17.6 12v4M21 12v3"/></svg>',
  keySilver: '<svg viewBox="0 0 24 24" fill="none" stroke="#dfe6ee" stroke-width="2.6" stroke-linecap="round"><circle cx="7" cy="12" r="4.4"/><path d="M11.4 12h10M17.6 12v4M21 12v3"/></svg>',
  boat: '<svg viewBox="0 0 24 24"><path d="M2.5 12.5h19l-2.6 5.5H5.1z" fill="#f4f1e8" stroke="#8a5a30" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 12.5l-2-4M17 12.5l2-4" stroke="#c9d1da" stroke-width="1.5" stroke-linecap="round"/><path d="M1.5 21c2 0 2-1.2 4-1.2s2 1.2 4 1.2 2-1.2 4-1.2 2 1.2 4 1.2 2-1.2 4-1.2" stroke="#5aa9e6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="none" stroke="#5aa9e6" stroke-width="2" stroke-linecap="round"><path d="M2 8c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 13c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 18c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>',
  ice: '<svg viewBox="0 0 24 24"><path d="M2 20l5-9 3 2 4-9 4 7 4 9z" fill="#eaf6ff" stroke="#9fd3ef" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 4l4 7 4 9h-6z" fill="#c6e2f3"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z" fill="#e8c15a" stroke="#a87912" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="20" r="2" fill="#a87912"/><path d="M2 8l2 1M22 8l-2 1M3 13h2M21 13h-2" stroke="#e8c15a" stroke-width="1.6" stroke-linecap="round"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#e8c15a" stroke-width="2.4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#e8c15a"/><circle cx="12" cy="16" r="1.8" fill="#6b4f10"/></svg>',
  open: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2e8b57"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>',

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = 0.2, when = 0, slide = 0) {
  const a = ac(); if (!a || !soundOn) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq) {
  const a = ac(); if (!a || !soundOn) return;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  src.connect(f).connect(g).connect(a.destination); src.start();
}

  const k = KEYMAP[e.code];

    if (state === 'play') { actionQueued = true; e.preventDefault(); }

    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const up = () => { btn.classList.remove('on'); if (k) input[k] = false; };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
});

// ---------- Game state ----------
let level = Math.max(1, Number(load('titanic.level', 1)) || 1);
let state = 'menu'; // menu | play | shop | winning | sinking | over
let screenKind = 'menu';
let G = null, player = null;
let screenShownAt = 0;

function freeX(zone, deck, taken) {
  const z = ZONES[zone];
  for (let i = 0; i < 80; i++) {
    const x = rand(z.a, z.b);
    const bad =
      taken.some(t => t.deck === deck && Math.abs(t.x - x) < 70) ||
      LADDERS.some(l => (l.from === deck || l.from + 1 === deck) && Math.abs(l.x - x) < 55) ||
      SPOT_DEFS.some(s => s.deck === deck && Math.abs(s.x - x) < 60) ||
      GATE_DEFS.some(g => g.deck === deck && Math.abs(g.x - x) < 60) ||
      (deck === SHOP.deck && Math.abs(x - SHOP.x) < 90) ||
      (deck === 0 && Math.abs(x - 260) < 90);
    if (!bad) return x;
  }
  return rand(z.a, z.b);
}

function adultLook() {
  const k = pick(KIDS);
  return { skin: k.skin, hair: pick(['#5a3a22', '#1c1410', '#8a8a8a', '#a8432a', '#e0b04f']), style: pick(['short', 'long', 'bun', 'curly']),
    coat: pick(COATS), pants: '#23262d', trim: '#ddd', collar: 'buttons', hat: pick(['bowler', 'none', 'bonnet', 'cap', 'none']), hatColor: pick(['#7a2e32', '#2f4a3a', '#4f6d8f']), scale: 1.18 };
}

function newGame() {
  const slow = prefs.slow;
  G = {
    time: 0,
    tHit: rand(Math.max(20, 32 - level * 2), Math.max(30, 52 - level * 3)) + (slow ? 10 : 0),
    hit: false, bellRung: false, waitMsg: false, bumpMsg: false,
    water: HULL_BOTTOM + 20,
    rate: Math.min(5.1, 3.4 * (1 + 0.1 * (level - 1))) * (slow ? 0.6 : 1),
    coins: 0, earned: 0, cls: 3, hasKey: false, silver: false,
    hatch: level >= 6, hatchHintT: -10, hatchMsgT: -10,
    jacket: false, shoes: false, swim: null,
    gates: GATE_DEFS.map(g => ({ ...g, open: false, lift: 0, msgT: -10, hintT: -10 })),
    spots: SPOT_DEFS.map(s => ({ ...s, zone: zoneOf(s.deck, s.x), searched: false, has: null })),
    boats: BOATS.map(x => ({ x, y: FLOOR(4) - 6, leaveAt: Infinity, state: 'docked', riders: [adultLook(), adultLook(), adultLook()] })),
    items: [], parts: [], npcs: [], trail: [], shake: 0, flash: 0, endT: 0, boat: null, cam: null, tilt: 0,
  };
  player = { x: 260, y: FLOOR(0), face: 1, walkT: 0, climb: false, moving: false };

  // Coins and money bags
  const plan = { d0: [5, 0], d1: [6, 1], d2: [3, 0], w2: [3, 1], d3: [2, 0], w3: [4, 1], d4: [2, 0] };
  for (const zone in plan) {
    const [coins, bags] = plan[zone], deck = ZONES[zone].deck;
    for (let i = 0; i < coins + bags; i++) {
      G.items.push({ deck, x: freeX(zone, deck, G.items), type: i < coins ? 'coin' : 'bag', taken: false, ph: Math.random() * 6 });
    }
  }

  // The key — the better you get, the better it hides
  if (level <= 2) {
    const zone = level === 1 ? pick(['d0', 'd1']) : pick(['d1', 'd2', 'd3']);
    const deck = ZONES[zone].deck;
    G.items.push({ deck, x: freeX(zone, deck, G.items), type: 'key', taken: false, ph: 0 });
  } else {
    const want = level === 3 ? ['low', 'mid'] : level === 4 ? ['c2'] : ['c1'];
    pick(G.spots.filter(s => want.includes(s.zone))).has = 'key';
  }
  // From level 6, a hatch on the way up needs a silver key
  if (G.hatch) pick(G.spots.filter(s => s.zone === 'low' && !s.has)).has = 'silver';
  for (const s of G.spots) if (!s.has) {
    const r = Math.random();
    s.has = r < 0.35 ? 'coin' : r < 0.55 ? 'bag' : null;
  }

  // A lost puppy somewhere on the ship
  const dz = pick(['d0', 'd1', 'd2', 'd3']);
  G.dog = { deck: ZONES[dz].deck, x: freeX(dz, ZONES[dz].deck, G.items), y: FLOOR(ZONES[dz].deck), face: -1, following: false, moving: false, walkT: 0 };

  // Passengers walking around
  G.npcs = NPC_ZONES.map(([deck, a, b]) => {
    const x = rand(a, b);
    return { deck, a, b, x, tx: rand(a, b), wait: rand(0, 2), face: 1, walkT: 0, moving: false, look: adultLook() };
  });
}

function buy(id) {

// ---------- Rules ----------
const deckAt = y => { for (let d = 0; d <= 4; d++) if (Math.abs(y - FLOOR(d)) < 0.6) return d; return -1; };
const classNeed = zone => zone === 'c2' ? 2 : zone === 'c1' ? 1 : 3;

function hitIceberg() {
  G.hit = true; G.shake = 1.4; G.flash = 1; G.hitAt = G.time;
  sfx.boom();
  warnEl.style.display = 'flex';
  msg('We hit an iceberg! Go up to a lifeboat before the water touches you!', 6, 'ice');
  for (let i = 0; i < 30; i++) G.parts.push({ k: 'ice', x: BOW_X - rand(0, 80), y: rand(560, 760), vx: rand(-60, 60), vy: rand(-140, -40), life: 1.2, s: rand(3, 6) });
  // From level 4 the first two lifeboats leave early (the last one always waits)
  if (level >= 4) {
    const first = 55 * (prefs.slow ? 1.5 : 1);
    G.boats[0].leaveAt = G.time + first;
    G.boats[1].leaveAt = G.time + first + 35;
  }
}

function setClass() {
  const c = G.earned >= COST_1ST ? 1 : G.earned >= COST_2ND ? 2 : 3;
  if (c < G.cls) {
    G.cls = c; sfx.up();
    msg(c === 2 ? 'Hooray! You are 2nd Class now!' : 'Wow! You are 1st Class now!', 3.5, 'coin');
    for (let i = 0; i < 16; i++) G.parts.push({ k: 'spark', x: player.x, y: player.y - 40, vx: rand(-140, 140), vy: rand(-200, -60), life: 1, s: rand(4, 8) });
  }
}

function addMoney(n, x, y) {
  G.coins += n; G.earned += n;
  sfx.coin();
  G.parts.push({ k: 'text', x, y: y - 50, vx: 0, vy: -50, life: 1, t: '+' + n });
  setClass();
}

function gotKey(x, y, silver) {
  sfx.key();
  if (silver) { G.silver = true; msg('You found the silver key! It opens the hatch.', 5, 'keySilver'); }
  else { G.hasKey = true; msg('You found the key! Now go up to the lifeboats.', 5, 'keyGold'); }
  for (let i = 0; i < 18; i++) G.parts.push({ k: 'spark', x, y: y - 30, vx: rand(-140, 140), vy: rand(-180, -40), life: 1.1, s: rand(4, 9) });
}

function tryGate(g) {
  const ok = g.need === 'key' ? G.hasKey : G.cls <= g.need;
  if (ok) {
    g.open = true; sfx.open();
    msg(g.need === 'key' ? 'The gate is open! Get in a lifeboat!' : g.need === 2 ? 'Welcome to the 2nd Class Lounge!' : 'Welcome to the 1st Class Ballroom!', 3.5, 'open');
    return true;
  }
  g.hintT = G.time;
  if (G.time - g.msgT > 4) {
    g.msgT = G.time; sfx.nope();
    if (g.need === 'key') msg('Locked! You need the key. It is hidden somewhere on the ship.', 3.5, 'lock');
    else if (g.need === 2) msg(`2nd Class only! Collect ${COST_2ND} coins to come in.`, 3.5, 'coin');
    else msg(`1st Class only! Collect ${COST_1ST} coins to come in.`, 3.5, 'coin');
  }
  return false;
}

function movePlayer(dt) {
  player.moving = false;
  const boost = G.shoes ? 1.35 : 1;
  const near = l => Math.abs(player.x - l.x) < 40;
  let lad = null;
  if (input.up) lad = LADDERS.find(l => near(l) && player.y > FLOOR(l.from + 1) + 0.5 && player.y <= FLOOR(l.from) + 0.5);
  if (!lad && input.down) lad = LADDERS.find(l => near(l) && player.y < FLOOR(l.from) - 0.5 && player.y >= FLOOR(l.from + 1) - 0.5);
  // the locked hatch (level 6+)
  if (lad && lad.x === HATCH_LADDER && G.hatch && input.up && player.y >= FLOOR(2) - 0.5) {
    if (G.silver) { G.hatch = false; sfx.open(); msg('The hatch is open!', 3, 'open'); }
    else {
      lad = null; G.hatchHintT = G.time;
      if (G.time - G.hatchMsgT > 4) { G.hatchMsgT = G.time; sfx.nope(); msg('The hatch is locked! Find the silver key.', 3.5, 'keySilver'); }
    }
  }
  if (lad) {
    player.x += (lad.x - player.x) * Math.min(1, dt * 15);
    if (input.up) player.y = Math.max(FLOOR(lad.from + 1), player.y - CLIMB * boost * dt);
    else player.y = Math.min(FLOOR(lad.from), player.y + CLIMB * boost * dt);
    player.walkT += dt; player.moving = true;
  }
  const d = deckAt(player.y);
  player.climb = d < 0;
  if (d < 0 || lad) return;

  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (!dir) return;
  // passengers slow you down from level 3
  let crowd = 1;
  if (level >= 3 && G.npcs.some(n => n.deck === d && Math.abs(n.x - player.x) < 26)) {
    crowd = 0.6;
    if (!G.bumpMsg) { G.bumpMsg = true; msg('Excuse me! Passengers are in the way.', 2.5, 'people'); }
  }
  player.face = dir; player.walkT += dt; player.moving = true;
  let nx = player.x + dir * SPEED * boost * crowd * dt;
  nx = d === 4 ? clamp(nx, BOAT_L + 24, BOAT_R - 24) : clamp(nx, IN_L + 24, IN_R - 24);
  for (const g of G.gates) {
    if (g.deck !== d || g.open) continue;
    if (player.x <= g.x - 22 + 0.01 && nx > g.x - 22) {
      if (!tryGate(g)) nx = g.x - 22;
    }
  }
  player.x = nx;
}

function interact() {
  const d = deckAt(player.y);
  // pick things up just by walking over them
  for (const it of G.items) {
    if (it.taken || it.deck !== d || Math.abs(it.x - player.x) > 32) continue;
    it.taken = true;
    if (it.type === 'coin') addMoney(1, it.x, FLOOR(d));
    else if (it.type === 'bag') addMoney(3, it.x, FLOOR(d));
    else gotKey(it.x, FLOOR(d));
  }
  // the puppy
  if (!G.dog.following && d === G.dog.deck && Math.abs(G.dog.x - player.x) < 40) {
    G.dog.following = true; sfx.pup();
    msg(`You found ${dogName()}! Bring them to the lifeboat.`, 4, 'dog');
    for (let i = 0; i < 10; i++) G.parts.push({ k: 'heart', x: G.dog.x, y: G.dog.y - 30, vx: rand(-60, 60), vy: rand(-120, -60), life: 1.1, s: rand(5, 8) });
  }
  // search or shop
  if (actionQueued) {
    actionQueued = false;
    const s = G.spots.find(s => !s.searched && s.deck === d && Math.abs(s.x - player.x) < 48);
    if (s) {
      s.searched = true; sfx.search();
      if (s.has === 'key') gotKey(s.x, FLOOR(d));
      else if (s.has === 'silver') gotKey(s.x, FLOOR(d), true);
      else if (s.has === 'coin') addMoney(1, s.x, FLOOR(d));
      else if (s.has === 'bag') addMoney(3, s.x, FLOOR(d));
      else msg('Nothing in here!', 1.6);
    } else if (d === SHOP.deck && Math.abs(SHOP.x - player.x) < 60) {
      openShop(); return;
    } else if (nearDoor(d)) {
      useDoor(); return;
    }
  }
  // lifeboats
  if (d === 4 && G.gates[2].open) {
    const b = G.boats.find(b => b.state === 'docked' && Math.abs(b.x - player.x) < 70);
    if (b) {
      if (G.hit) win(b);
      else if (!G.waitMsg) {
        G.waitMsg = true;
        G.tHit = Math.min(G.tHit, G.time + 5);
        msg('The lifeboats leave after the iceberg. Wait here!', 3.5, 'boat');
      }
    }
  }
}

function updateWorld(dt) {
  // passengers stroll, then hurry after the iceberg (and head upstairs when their deck floods)
  G.npcs = G.npcs.filter(n => G.water > FLOOR(n.deck) + 2);
  for (const n of G.npcs) {
    n.moving = false;
    if (n.wait > 0) { n.wait -= dt; continue; }
    const dx = n.tx - n.x, sp = G.hit ? 85 : 35;
    if (Math.abs(dx) < 4) { n.tx = rand(n.a, n.b); n.wait = G.hit ? rand(0, 0.6) : rand(1, 3); continue; }
    n.face = Math.sign(dx); n.x += n.face * Math.min(Math.abs(dx), sp * dt); n.moving = true; n.walkT += dt * (G.hit ? 1.4 : 0.8);
  }
  // the puppy follows your footsteps
  if (player.moving) {
    G.trail.push({ x: player.x, y: player.y, face: player.face });
    if (G.trail.length > 40) G.trail.shift();
  }
  if (G.dog.following) {
    const p = G.trail.length > 22 ? G.trail[G.trail.length - 22] : null;
    G.dog.moving = player.moving && !!p;
    if (p) { G.dog.x = p.x; G.dog.y = p.y; G.dog.face = p.face; }
    if (G.dog.moving) G.dog.walkT += dt;
  }
  // lifeboats leaving early
  for (const b of G.boats) {
    if (b.state === 'docked' && G.time >= b.leaveAt) {
      b.state = 'leaving';
      msg('A lifeboat just left! Hurry!', 3.5, 'boat');
    } else if (b.state === 'leaving') {
      const sea = seaY();
      if (b.y < sea - 2) b.y = Math.min(sea - 2, b.y + 70 * dt);
      else { b.x += 40 * dt; if (b.x > WORLD_W + 200) b.state = 'gone'; }
    }
  }
  // the ship tips bow-first as it fills
  if (G.hit) G.tilt = Math.min(0.045, (G.time - G.hitAt) * 0.0005);
}

function win(b) {
  state = 'winning'; G.endT = 0;
  b.state = 'taken';
  G.boat = { x: b.x, y: FLOOR(4) - 4 };
  warnEl.style.display = 'none';
  sfx.win();
  msg(G.dog.following ? `All aboard! You and ${dogName()} made it!` : 'All aboard! You made it!', 4, 'boat');
  level++; save('titanic.level', level);
  const colors = ['#e8c15a', '#5aa9e6', '#e5484d', '#5bd18b', '#f4f1e8'];
  for (let i = 0; i < 60; i++) G.parts.push({ k: 'confetti', x: b.x + rand(-120, 120), y: FLOOR(4) - rand(80, 200), vx: rand(-80, 80), vy: rand(-160, 0), life: rand(2, 3.5), c: pick(colors), r: rand(0, 6) });
}

function lose() {
  state = 'sinking'; G.endT = 0;
  warnEl.style.display = 'none';
  sfx.splash(); setTimeout(sfx.lose, 500);
  for (let i = 0; i < 18; i++) G.parts.push({ k: 'drop', x: player.x, y: G.water, vx: rand(-90, 90), vy: rand(-220, -80), life: 1, s: rand(3, 6) });
}

function update(dt) {
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.classList.remove('show'); }
  if (!G || state === 'shop') return;
  for (const p of G.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'confetti') { p.vy = Math.min(p.vy + 160 * dt, 70); p.vx *= 0.99; p.r += dt * 6; }
    else if (p.k === 'heart') p.vy += 60 * dt;
    else if (p.k !== 'text') p.vy += 260 * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  G.shake = Math.max(0, G.shake - dt);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  for (const g of G.gates) g.lift += ((g.open ? 1 : 0) - g.lift) * Math.min(1, dt * 5);

  if (state === 'play') {
    G.time += dt;
    if (!G.bellRung && G.time > G.tHit - 6) {
      G.bellRung = true; sfx.bell();
      msg('Ding ding ding! Iceberg ahead!', 3.5, 'bell');
    }
    if (!G.hit && G.time >= G.tHit) hitIceberg();
    if (G.hit) G.water -= G.rate * dt;
    movePlayer(dt);
    updateWorld(dt);
    interact();
    if (state === 'play' && G.water < player.y - 2) {
      if (G.jacket) startSwim('float'); else lose();
    }
  } else if (state === 'winning') {
    G.endT += dt;
    updateWorld(dt);
    const sea = seaY();
    if (G.boat.y < sea - 2) G.boat.y = Math.min(sea - 2, G.boat.y + 90 * dt);
    else G.boat.x -= 50 * dt;
    if (G.endT > 4.5) showScreen('win');
  } else if (state === 'sinking') {
    G.endT += dt;
    player.y += 25 * dt;
    if (G.endT > 1.8) showScreen('lose');
  } else if (state === 'swim') updateSwim(dt);
  else if (state === 'swimwin') { G.endT += dt; swimDrift(dt); if (G.endT > 3) showScreen('win'); }
  else if (state === 'swimlose') { G.endT += dt; if (G.endT > 1.8) showScreen('lose'); }
  updateHud();
}

// ---------- Swimming to a lifeboat (needs a life jacket) ----------
const SEA_W = 2200, SEA_H = 1800;
const DOORS = [{ deck: 1, x: 175 }, { deck: 2, x: 175 }]; // gangway doors on the lower decks
const nearDoor = d => DOORS.some(o => o.deck === d && Math.abs(o.x - player.x) < 40);
function useDoor() {
  if (!G.hit) { msg('The ship is safe for now. Keep exploring!', 3, 'open'); return; }
  if (!G.jacket) { sfx.nope(); msg('You need a life jacket to jump into the sea. The shop sells them.', 4, 'jacket'); return; }
  startSwim('jump');
}
function bergShape(r, seed) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, n = Math.abs(Math.sin(seed * 12.9 + i * 7.3) * 43758.5) % 1;
    pts.push([Math.cos(a) * r * (0.72 + 0.38 * n), Math.sin(a) * r * (0.72 + 0.38 * n)]);
  }
  return pts;
}
function startSwim(how) {
  state = 'swim';
  warnEl.style.display = 'none';
  sfx.splash();
  const S = { x: 760, y: 430, vx: 0, vy: 60, ang: Math.PI / 2, warmth: 100, t: 0, cause: null, moving: false,
    bergs: [], sharks: [], boats: [], debris: [], cam: null, sharkMsg: false, iceMsgT: -9,
    dog: G.dog.following ? { x: 730, y: 395 } : null };
  const xs = [rand(250, 600), rand(900, 1300), rand(1600, 1950)];
  S.boats = xs.map(x => ({ x, y: rand(1350, 1600), vx: rand(-8, 8), vy: rand(3, 7), ph: rand(0, 6), riders: [adultLook(), adultLook()] }));
  for (let i = 0; i < 200 && S.bergs.length < 10; i++) {
    const b = { x: rand(150, SEA_W - 150), y: rand(600, 1300), r: rand(40, 85), seed: Math.random() * 10 };
    if (Math.hypot(b.x - S.x, b.y - S.y) > 300 && S.bergs.every(o => Math.hypot(o.x - b.x, o.y - b.y) > (o.r + b.r) * 1.3 + 110)) {
      b.pts = bergShape(b.r, b.seed); S.bergs.push(b);
    }
  }
  const count = level >= 6 ? 3 : level >= 3 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    let x, y; do { x = rand(200, SEA_W - 200); y = rand(700, 1350); } while (Math.hypot(x - S.x, y - S.y) < 550);
    S.sharks.push({ x, y, tx: x, ty: y, ang: rand(0, 6), speed: Math.min(120, 85 + level * 5) * (prefs.slow ? 0.8 : 1), chase: false });
  }
  S.debris = Array.from({ length: 16 }, () => ({ x: rand(250, SEA_W - 250), y: rand(330, 1000), k: pick(['chair', 'crate', 'ring']), a: rand(0, 6) }));
  G.swim = S; G.flash = 0.6;
  msg(how === 'jump' ? 'Splash! Swim to a lifeboat before you get too cold!' : 'Your life jacket floated you out! Swim to a lifeboat!', 5, 'jacket');
}
function updateSwim(dt) {
  const S = G.swim; S.t += dt;
  const sp = 165 * (G.shoes ? 1.2 : 1);
  const ax = (input.right ? 1 : 0) - (input.left ? 1 : 0), ay = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  const len = Math.hypot(ax, ay) || 1;
  S.vx += ((ax / len) * sp - S.vx) * Math.min(1, dt * 3);
  S.vy += ((ay / len) * sp - S.vy) * Math.min(1, dt * 3);
  S.x = clamp(S.x + S.vx * dt, 40, SEA_W - 40); S.y = clamp(S.y + S.vy * dt, 330, SEA_H - 40);
  S.moving = !!(ax || ay);
  if (Math.hypot(S.vx, S.vy) > 20) S.ang = Math.atan2(S.vy, S.vx);
  // icebergs block you and make you colder
  let chill = 0;
  for (const b of S.bergs) {
    const r = pushOut(S.x, S.y, b, 15);
    if (r.hit) { S.x = r.x; S.y = r.y; chill = 1; } else if (r.gap < 45) chill = Math.max(chill, 0.35);
  }
  S.warmth -= dt * ((prefs.slow ? 2 : 3) + chill * 9);
  if (chill === 1 && S.t - S.iceMsgT > 6) { S.iceMsgT = S.t; msg('Brrr! Touching ice makes you colder.', 2.5, 'cold'); }
  // sharks chase you when you get close; you can outswim them
  for (const k of S.sharks) {
    const d = Math.hypot(S.x - k.x, S.y - k.y);
    k.chase = d < 280;
    if (k.chase) { k.tx = S.x; k.ty = S.y; if (!S.sharkMsg) { S.sharkMsg = true; msg('A shark! Swim away from it!', 2.5, 'shark'); } }
    else if (Math.hypot(k.tx - k.x, k.ty - k.y) < 30) { k.tx = rand(150, SEA_W - 150); k.ty = rand(650, 1450); }
    let da = Math.atan2(k.ty - k.y, k.tx - k.x) - k.ang;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    k.ang += clamp(da, -2.2 * dt, 2.2 * dt);
    const v = k.chase ? k.speed : k.speed * 0.5;
    k.x += Math.cos(k.ang) * v * dt; k.y += Math.sin(k.ang) * v * dt;
    for (const b of S.bergs) { const r = pushOut(k.x, k.y, b, 22); if (r.hit) { k.x = r.x; k.y = r.y; } }
    if (d < 30) { S.cause = 'shark'; swimLose(); return; }
  }
  if (S.warmth <= 0) { S.warmth = 0; S.cause = 'cold'; swimLose(); return; }
  swimDrift(dt);

    const dx = S.x - S.dog.x, dy = S.y - S.dog.y, d = Math.hypot(dx, dy);

  }

  if (boat) swimWin(boat);
}
function pushOut(px, py, b, pad) { // keep a point outside an iceberg's (rotated) square
  const c = Math.cos(-b.seed), s = Math.sin(-b.seed), dx = px - b.x, dy = py - b.y;
  let lx = dx * c - dy * s, ly = dx * s + dy * c;

}
function swimDrift(dt) {
  for (const b of G.swim.boats) { b.x = clamp(b.x + b.vx * dt, 120, SEA_W - 120); b.y = Math.min(b.y + b.vy * dt, SEA_H - 90); }
}
function swimWin(boat) {

  state = 'swimwin'; G.endT = 0; S.boat = boat;
  sfx.win();
  msg(S.dog ? `They pulled you and ${dogName()} into the lifeboat!` : 'They pulled you into the lifeboat! You made it!', 4, 'boat');
  level++; save('titanic.level', level);
  const colors = ['#e8c15a', '#5aa9e6', '#e5484d', '#5bd18b', '#f4f1e8'];
  for (let i = 0; i < 50; i++) G.parts.push({ k: 'confetti', x: boat.x + rand(-90, 90), y: boat.y - rand(40, 140), vx: rand(-80, 80), vy: rand(-160, 0), life: rand(2, 3), c: pick(colors), r: rand(0, 6) });
}
function swimLose() {
  state = 'swimlose'; G.endT = 0;
  sfx.splash(); setTimeout(sfx.lose, 400);
  for (let i = 0; i < 16; i++) G.parts.push({ k: 'drop', x: G.swim.x, y: G.swim.y, vx: rand(-90, 90), vy: rand(-160, -40), life: 0.9, s: rand(3, 6) });
}

  if (!S.cam) S.cam = { x: camX, y: camY };

  camX = S.cam.x; camY = S.cam.y;

const hudCache = {};

  const cls = G.cls;

  if (hudCache.sig === sig) return;

// ---------- Guide arrow ----------
const guideOn = () => prefs.guide === 'on' || (prefs.guide === 'auto' && level <= 2);
const dist = (a, d, x) => Math.abs(a.deck - d) * 1500 + Math.abs(a.x - x);
function reachable(deck, x) {
  const z = zoneOf(deck, x);
  if (G.cls > classNeed(z)) return false;
  if (deck >= 3 && G.hatch && !G.silver) return false;
  return true;
}
function guideTarget() {
  const d = deckAt(player.y);
  if (d < 0) return null;
  const nearest = list => list.sort((a, b) => dist(a, d, player.x) - dist(b, d, player.x))[0];
  if (G.hatch && !G.silver) {
    const s = G.spots.find(s => s.has === 'silver' && !s.searched);
    if (s) return s;
  }
  if (!G.hasKey) {
    const k = G.items.find(i => i.type === 'key' && !i.taken) || G.spots.find(s => s.has === 'key' && !s.searched);
    if (k && reachable(k.deck, k.x)) return k;
    const coin = nearest(G.items.filter(i => !i.taken && i.type !== 'key' && reachable(i.deck, i.x)));
    if (coin) return coin;
    return nearest(G.spots.filter(s => !s.searched && reachable(s.deck, s.x)));
  }
  return nearest(G.boats.filter(b => b.state === 'docked').map(b => ({ deck: 4, x: b.x })));
}
function guideWaypoint() {
  const tgt = guideTarget(); if (!tgt) return null;
  const d = deckAt(player.y);
  if (tgt.deck === d) return { x: tgt.x, y: FLOOR(d) - 108, kind: 'here' };
  const up = tgt.deck > d;
  const lads = LADDERS.filter(l => l.from === (up ? d : d - 1)).sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x));
  if (!lads.length) return null;
  return { x: lads[0].x, y: FLOOR(d) - 108, kind: up ? 'up' : 'down' };
}

  }
  cx.globalAlpha = 1;
  const sunX = W * 0.8 - pan * 0.2, sunY = H * (0.42 + dusk * 0.5);
  glow(sunX, sunY, 200, 'rgba(255,190,90,A)', 0.5 * (1 - dusk));
  cx.fillStyle = mixColor('#ffd166', '#c25a4a', dusk); circle(sunX, sunY, 52); cx.fill();
  for (const c2 of CLOUDS) {
    const x = ((c2.x * W * 1.6 - pan * 0.4 + t * 6) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.3, y = c2.y * H;
    cx.fillStyle = `rgba(255,${190 - dusk * 90},${200 - dusk * 60},${0.55 - dusk * 0.35})`;
    for (const [dx, dy, r] of [[0, 0, 26], [28, -10, 30], [58, 0, 24], [26, 8, 26]]) { circle(x + dx * c2.s, y + dy * c2.s, r * c2.s); cx.fill(); }
  }
  cx = saved;
}

// ---------- The flat overlay: prompts, particles, arrows, minimap ----------
function drawOverlay3D(t, W, H) {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
  if (!G) return;
  const k = 1.2;
  const at = (p, fn) => { if (p.off) return; cx.save(); cx.setTransform(dpr * k, 0, 0, dpr * k, p.x * dpr, p.y * dpr); fn(); cx.restore(); };
  if (G.swim) { overlaySwim3D(t, W, H, at); return; }
  const pd = deckAt(player.y);
  if (state === 'play' && pd >= 0) {
    for (const s of G.spots) if (!s.searched && s.deck === pd && Math.abs(s.x - player.x) < 48) at(shipToScreen(s.x, FLOOR(pd) - 70, -2.6), () => prompt(0, 0, 'search'));
    if (pd === SHOP.deck && Math.abs(SHOP.x - player.x) < 60) at(shipToScreen(SHOP.x + 60, FLOOR(pd) - 60), () => prompt(0, 0, 'shop'));
    for (const o of DOORS) if (o.deck === pd && Math.abs(o.x - player.x) < 40 && G.hit) {
      if (G.jacket) at(shipToScreen(o.x + 20, FLOOR(pd) - 100, ZB), () => prompt(0, 0, 'jump')); else at(shipToScreen(o.x + 24, FLOOR(pd) - 100, ZB), () => needBubble(0, 0, 'jacket', ''));
    }
    for (const l of LADDERS) {
      if (Math.abs(l.x - player.x) > 40) continue;
      if (l.from === pd) {
        if (l.x === HATCH_LADDER && G.hatch && !G.silver) at(shipToScreen(l.x, FLOOR(pd) - 96, -1.4), () => needBubble(0, 0, 'silver', ''));
        else at(shipToScreen(l.x, FLOOR(pd) - 100, -1.4), () => prompt(0, 0, 'up'));
      }
      if (l.from + 1 === pd) at(shipToScreen(l.x, FLOOR(pd) - 100, -1.4), () => prompt(0, 0, 'down'));
    }
    for (const c of CREW) if (G.hit && c.deck < 4 && pd === c.deck && Math.abs(player.x - c.x) < 260 && G.water > FLOOR(c.deck) + 2) at(shipToScreen(c.x, FLOOR(c.deck) - 92, -1.9), () => prompt(0, 0, 'up'));
    for (const g of G.gates) if (!g.open && G.time - g.hintT < 3) {
      const cost = g.need === 2 ? COST_2ND : COST_1ST;
      at(shipToScreen(g.x - 40, FLOOR(g.deck) - 96), () => g.need === 'key' ? needBubble(0, 0, 'key', '?') : needBubble(0, 0, 'coin', `${Math.min(G.earned, cost)}/${cost}`));
    }
    if (!G.dog.following && Math.sin(t * 3) > 0.3) at(shipToScreen(G.dog.x + 8, G.dog.y - 48, 1.6), () => { cx.fillStyle = '#ff7a8a'; drawHeart(0, 0, 6); });
  }
  drawParticles3D(p => shipToScreen(p.x, p.y), at);
  vignette(W, H);
  if (G.flash > 0) { cx.fillStyle = `rgba(255,255,255,${G.flash * 0.5})`; cx.fillRect(0, 0, W, H); }
  if (state === 'play') {
    const pdeck = deckAt(player.y);
    if (G.hit && pdeck >= 0 && pdeck < 4 && (G.time - G.hitAt < 8 || G.water - player.y < 150)) {
      const p = shipToScreen(player.x + 36, player.y - 80);
      drawUpBadge(p.x, p.y - Math.abs(Math.sin(t * 5)) * 8, 0.6 + 0.4 * Math.abs(Math.sin(t * 5)));
    }
    if (guideOn()) drawGuide((x, y) => shipToScreen(x, y), W, H, t);
  }
  drawMiniMap(W, H);
}
function drawParticles3D(toScr, at) {
  for (const p of G.parts) {
    const a = clamp(p.life, 0, 1);
    at(toScr(p), () => {
      cx.globalAlpha = a;
      if (p.k === 'text') {
        cx.font = `700 22px ${FONT}`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.lineWidth = 4; cx.strokeStyle = 'rgba(40,25,0,0.8)'; cx.strokeText(p.t, 0, 0);
        cx.fillStyle = '#f6d77a'; cx.fillText(p.t, 0, 0);
      } else if (p.k === 'spark') { cx.fillStyle = '#ffe58a'; drawSpark(0, 0, p.s); }
      else if (p.k === 'heart') { cx.fillStyle = '#ff7a8a'; drawHeart(0, 0, p.s); }
      else if (p.k === 'drop') { cx.fillStyle = '#7cc0f0'; circle(0, 0, p.s); cx.fill(); }
      else if (p.k === 'ice') { cx.fillStyle = '#eaf6ff'; cx.fillRect(0, 0, p.s, p.s); }
      else if (p.k === 'confetti') { cx.fillStyle = p.c; cx.rotate(p.r); cx.fillRect(-4, -2, 8, 4); }
      cx.globalAlpha = 1;
    });
  }
}
function overlaySwim3D(t, W, H, at) {
  const S = G.swim;
  drawParticles3D(p => project3(p.x * U, 1.5, p.y * U), at);
  for (const k of S.sharks) if (k.chase) at(project3(k.x * U, 2.6, k.y * U), () => { cx.fillStyle = '#e5484d'; cx.font = `700 26px ${FONT}`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('!', 0, 0); });
  vignette(W, H);
  if (G.flash > 0) { cx.fillStyle = `rgba(255,255,255,${G.flash * 0.5})`; cx.fillRect(0, 0, W, H); }
  // warmth bar
  const bw = Math.min(260, W - 140), bx = W / 2 - bw / 2, by = isTouch ? 124 : H - 46;
  cx.fillStyle = 'rgba(9,18,40,0.85)'; rr(bx - 44, by - 6, bw + 56, 30, 15); cx.fill();
  cx.fillStyle = '#dfe6ee'; rr(bx - 30, by - 1, 8, 16, 4); cx.fill(); cx.fillStyle = '#5aa9e6'; circle(bx - 26, by + 16, 6); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,0.12)'; rr(bx - 6, by + 2, bw, 14, 7); cx.fill();
  const w = clamp(S.warmth, 0, 100) / 100 * bw;
  cx.fillStyle = S.warmth > 60 ? '#f2994a' : S.warmth > 30 ? '#f2c94c' : `rgba(90,169,230,${0.65 + 0.35 * Math.sin(t * 8)})`;
  if (w > 1) { rr(bx - 6, by + 2, Math.max(14, w), 14, 7); cx.fill(); }
  if (state === 'swim') {
    const nb = S.boats.slice().sort((a, b) => Math.hypot(a.x - S.x, a.y - S.y) - Math.hypot(b.x - S.x, b.y - S.y))[0];
    const p = project3(nb.x * U, 1, nb.y * U), m = 46;
    if (p.x < m || p.x > W - m || p.y < 110 || p.y > H - m) {
      const ex = clamp(p.x, m, W - m), ey = clamp(p.y, 120, H - 90), ang = Math.atan2(p.y - ey, p.x - ex), bob = Math.sin(t * 5) * 6;
      cx.save(); cx.translate(ex + Math.cos(ang) * bob, ey + Math.sin(ang) * bob); cx.rotate(ang);
      cx.fillStyle = 'rgba(9,18,40,0.8)'; circle(0, 0, 24); cx.fill();
      cx.fillStyle = '#e8c15a'; cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(-8, -12); cx.lineTo(-3, 0); cx.lineTo(-8, 12); cx.closePath(); cx.fill();
      cx.restore();
    }
  }
}

function draw3D(now) {
  const t = now / 1000, W = innerWidth, H = innerHeight;
  let dusk = 0, lights = 1;
  if (G && G.swim) dusk = 0.55;
  else if (G && G.hit) {
    const fill = clamp((HULL_BOTTOM - G.water) / (HULL_BOTTOM - FLOOR(4)), 0, 1);
    dusk = clamp(fill * 1.3, 0, 1);
    lights = 0.85 - fill * 0.3 - 0.08 * fill * (0.5 + 0.5 * Math.sin(t * 0.8));
  }
  drawSky3D(t, W, H, dusk);
  update3D(t, dusk, lights);
  R3.renderer.render(R3.scene, R3.camera);
  drawOverlay3D(t, W, H);
}
function resize3D() {
  if (!use3D) return;
  R3.renderer.setSize(innerWidth, innerHeight, false);
  R3.camera.aspect = innerWidth / innerHeight; R3.camera.updateProjectionMatrix();
  const s = document.getElementById('sky'); s.width = Math.floor(innerWidth * dpr); s.height = Math.floor(innerHeight * dpr);
}

function draw(now) { if (use3D) draw3D(now); else drawClassic(now); }
function start3D() {
  if (use3D) return;
  try { use3D = init3D(); } catch (e) { console.warn('3D unavailable, using 2D', e); use3D = false; }
  if (use3D) { document.body.classList.add('three'); resize3D(); if (G) rebuild3D(); }
}
addEventListener('resize', () => resize3D());
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(start3D);

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw(now);
  requestAnimationFrame(frame);
}
showScreen('menu');
requestAnimationFrame(frame);
</script>
</body>
</html>
