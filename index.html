<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Titanic Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060d1f;
    --glass: rgba(9, 18, 40, 0.78);
    --glass-strong: rgba(10, 20, 44, 0.94);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --muted: #9fb0d0;
    --gold: #e8c15a;
    --gold-deep: #a9811f;
    --danger: #e5484d;
    --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game, #sky, #gl { display: block; width: 100vw; height: 100vh; position: fixed; inset: 0; }
  #sky, #gl { display: none; }
  body.three #sky, body.three #gl { display: block; }
  svg { display: block; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .panel { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--glass);
    border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
  .stat { display: flex; align-items: center; gap: 7px; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 46px; }
  .stat svg { width: 22px; height: 22px; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  .badge { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
  .badge.c3 { background: linear-gradient(180deg, #d39a66, #9c6438); color: #2a1406; }
  .badge.c2 { background: linear-gradient(180deg, #e9eef3, #aab4bf); color: #1c2530; }
  .badge.c1 { background: linear-gradient(180deg, #f6d77a, #c99a26); color: #2b1d00; }
  .slot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: rgba(255,255,255,0.22);
    border: 1px dashed rgba(255,255,255,0.22); transition: all 0.3s; flex: none; }
  .slot svg { width: 22px; height: 22px; }
  .slot.have { color: var(--gold); border: 1px solid var(--gold); box-shadow: 0 0 14px rgba(232, 193, 90, 0.55); }
  #silverSlot.have { color: #dfe6ee; border-color: #dfe6ee; box-shadow: 0 0 14px rgba(223, 230, 238, 0.5); }
  .slot.item { display: none; border-style: solid; border-color: rgba(255,255,255,0.3); }
  .slot.item.have { display: grid; box-shadow: none; }
  .spacer { flex: 1; }
  .lvl { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .lvl b { font-size: 21px; color: var(--text); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  #pauseBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #pauseBtn svg { width: 22px; height: 22px; }
  [hidden] { display: none !important; }
  .face-wrap { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; text-align: left; margin: 14px 0 20px; }
  #facePreview { width: 200px; height: 200px; border-radius: 22px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); }
  .face-tools .seg { margin-bottom: 14px; }
  .face-tools .lbl { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,0.05); padding: 0; cursor: pointer; display: grid; place-items: center; }
  .chip canvas { width: 40px; height: 40px; }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: rgba(232,193,90,0.18); }
  #facePad { width: 240px; height: 240px; border-radius: 18px; touch-action: none; cursor: crosshair; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); }
  .pad-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .pad-tools .secondary { padding: 6px 10px; font-size: 14px; }
  .pad-tools .secondary[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .ink { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
  .ink[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,193,90,0.4); }
  @media (max-width: 560px) { .face-wrap { grid-template-columns: 1fr; justify-items: center; } }
  #fsBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #fsBtn svg { width: 22px; height: 22px; }
  #fsBtn[hidden] { display: none; }
  #soundBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #soundBtn svg { width: 22px; height: 22px; }

  #toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); display: flex; align-items: center; gap: 10px;
    background: var(--glass-strong); border: 1px solid rgba(232,193,90,0.7); border-radius: 999px; padding: 6px 16px 6px 6px;
    font-size: 16px; pointer-events: none; opacity: 0; transition: opacity 0.25s, transform 0.25s; box-shadow: 0 10px 30px rgba(0,0,0,0.35); z-index: 5; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  body:has(#screen:not(.hide)) #toast { bottom: auto; top: 12px; }
  #photoBtn { pointer-events: auto; cursor: pointer; color: var(--text); width: 44px; padding: 0; justify-content: center; font: inherit; }
  #photoBtn svg { width: 22px; height: 22px; }
  body.three.mini #sky, body.three.mini #gl { display: none; }
  body.mini #hud > .panel:first-child, body.mini .lvl, body.mini #warn { display: none !important; }
  .sticker { --c: #1e5aa8; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%), var(--c);
    border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .sticker svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.2)); color: #fff; }
  .sticker.sm { width: 34px; height: 34px; border-width: 2px; }
  .sticker.sm svg { width: 18px; height: 18px; }
  .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .sticker-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 14px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .sticker-cell b { color: var(--text); font-size: 15px; font-weight: 600; }
  .sticker-cell.locked .sticker { opacity: 0.35; filter: grayscale(1); }
  .new-stickers { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 4px 0 14px; }
  .sticker-mini { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; animation: pop 0.5s ease-out; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
  .route { list-style: none; padding: 0; margin: 4px 0 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; counter-reset: stop; }
  .stop { width: 100%; height: 100%; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 4px 10px; align-items: start;
    text-align: left; padding: 12px; border-radius: 16px; cursor: pointer; font: inherit; color: var(--text);
    background: rgba(255,255,255,0.06); border: 1.5px solid var(--line); position: relative; }
  .stop:not(:disabled):hover { border-color: var(--gold); background: rgba(232,193,90,0.1); }
  .stop:disabled { cursor: not-allowed; opacity: 0.45; }
  .stop .num { position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #2b1d00; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .stop-icon svg { width: 34px; height: 34px; }
  .stop-text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.3; color: var(--muted); min-width: 0; }
  .stop-text b { color: var(--text); font-size: 16px; font-weight: 600; }
  .stop-text .sub { color: var(--gold); font-weight: 600; }
  .tag { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.1); color: var(--muted); }
  .tag svg { width: 12px; height: 12px; }
  .tag.done { background: rgba(46,139,87,0.3); color: #b9f5cf; }
  .tag.new { background: rgba(232,193,90,0.25); color: var(--gold); }
  .map-tools { margin-bottom: 8px; }
  .count { background: rgba(255,255,255,0.14); border-radius: 999px; padding: 1px 8px; font-size: 13px; }
  .big-icon { width: 76px; height: 76px; }
  .big-icon svg { width: 76px; height: 76px; }
  img.photo { width: 100%; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 10px 0 8px; transform: rotate(-1.5deg); }
  a.as-btn { text-decoration: none; display: inline-block; }
  .souv-items { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .souv-pic { width: 120px; height: 90px; }
  @media (max-width: 700px) { .route { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 460px) { .route { grid-template-columns: 1fr; } }
  #msg { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -8px); max-width: min(92vw, 640px);
    display: flex; align-items: center; gap: 12px;
    background: var(--glass-strong); border: 1px solid rgba(232, 193, 90, 0.55); border-radius: 14px; padding: 10px 20px;
    font-size: clamp(17px, 2.6vw, 22px); font-weight: 500; text-align: left; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35); transition: opacity 0.25s, transform 0.25s; opacity: 0; }
  #msg svg { width: 34px; height: 34px; flex: none; }
  #msg.show { opacity: 1; transform: translate(-50%, 0); }
  #warn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
    background: rgba(120, 14, 20, 0.88); border: 1px solid rgba(255, 120, 120, 0.6); color: #fff; border-radius: 12px;
    padding: 8px 16px; font-size: clamp(14px, 2.2vw, 18px); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    pointer-events: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  #warn .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff6b6b; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- Touch controls ---------- */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #warn { bottom: auto; top: 118px; }
  body.touch #toast { bottom: auto; top: 170px; }
  .pad { position: fixed; bottom: 18px; display: flex; gap: 12px; align-items: flex-end; }
  #padL { left: 18px; }
  #padR { right: 18px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .tbtn { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: rgba(9, 18, 40, 0.62); border: 1.5px solid rgba(255,255,255,0.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tbtn svg { width: 30px; height: 30px; }
  .tbtn.on { background: rgba(232, 193, 90, 0.85); color: #1f1600; }
  #btnSearch { width: 82px; height: 82px; border-color: var(--gold); color: var(--gold); }
  #btnSearch.on { color: #1f1600; }

  /* ---------- Screens ---------- */
  #screen { position: fixed; inset: 0; display: flex; padding: 16px; touch-action: pan-y;
    background: radial-gradient(ellipse at center, rgba(6, 13, 31, 0.55), rgba(3, 7, 18, 0.9)); overflow-y: auto; }
  #screen.hide { display: none; }
  .card { width: 100%; max-width: 580px; text-align: center; padding: 28px 30px 24px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(20, 36, 72, 0.96), rgba(10, 20, 44, 0.97));
    border: 1px solid rgba(232, 193, 90, 0.35); box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08); margin: auto; }
  .eyebrow { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  .card h1 { margin: 6px 0 8px; font-size: clamp(34px, 7vw, 50px); font-weight: 700; letter-spacing: 0.01em; line-height: 1.05; text-wrap: balance; }
  .card h2 { margin: 10px 0 6px; font-size: clamp(28px, 6vw, 38px); font-weight: 700; text-wrap: balance; }
  .lede { margin: 0 auto 18px; max-width: 430px; color: var(--muted); font-size: 17px; line-height: 1.45; }
  .hero { width: 180px; height: 96px; margin: 0 auto 4px; }
  .label { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .avatars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0 0 18px; }
  .avatar { width: 62px; height: 74px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,0.05);
    cursor: pointer; padding: 0; display: grid; place-items: center; transition: transform 0.1s; }
  .avatar img { width: 54px; height: 68px; }
  .avatar:hover { transform: translateY(-2px); }
  .avatar[aria-pressed="true"] { border-color: var(--gold); background: rgba(232,193,90,0.15); box-shadow: 0 0 14px rgba(232,193,90,0.4); }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; text-align: left; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); font-size: 15px; line-height: 1.25; }
  .step svg { width: 30px; height: 30px; flex: none; }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .controls span { display: inline-flex; align-items: center; gap: 4px; }
  kbd { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text); min-width: 26px; height: 26px; padding: 0 7px;
    display: inline-grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    border-bottom-width: 3px; }
  .level-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 18px; color: var(--muted);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
  .level-row b { color: var(--text); font-size: 20px; letter-spacing: 0; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .pip.on { background: var(--gold); box-shadow: 0 0 8px rgba(232,193,90,0.6); }
  .next { display: inline-flex; align-items: center; gap: 8px; margin: -4px auto 18px; padding: 8px 14px; border-radius: 12px;
    background: rgba(232,193,90,0.1); border: 1px solid rgba(232,193,90,0.35); font-size: 15px; color: var(--text); text-align: left; }
  .next svg { width: 24px; height: 24px; flex: none; }
  .saved { display: inline-flex; align-items: center; gap: 10px; margin: 0 auto 16px; font-size: 17px; font-weight: 500; }
  .saved svg { width: 34px; height: 34px; }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary { font-family: var(--font); font-size: 22px; font-weight: 600; letter-spacing: 0.04em; padding: 14px 54px; border-radius: 14px;
    border: none; cursor: pointer; color: #2b1d00; background: linear-gradient(180deg, #f6d77a, #d9a92c);
    box-shadow: 0 6px 0 #9a7417, 0 12px 26px rgba(217, 169, 44, 0.3); transition: transform 0.08s, box-shadow 0.08s; }
  .primary { position: relative; }
  .primary::before { content: ""; position: absolute; left: 18px; right: 18px; top: -7px; height: 7px;
    background-image: linear-gradient(180deg, #f8dc85, #e6b53a); border-radius: 3px 3px 0 0;
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 18px, transparent 18px 30px); mask: repeating-linear-gradient(90deg, #000 0 18px, transparent 18px 30px); }
  .primary:hover { filter: brightness(1.05); }
  .primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a7417; }
  .secondary { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font); font-size: 16px; font-weight: 500;
    padding: 9px 16px; border-radius: 12px; cursor: pointer; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18); }
  .secondary svg { width: 20px; height: 20px; }
  .secondary:hover { background: rgba(255,255,255,0.1); }
  .link { background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 14px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .form { text-align: left; display: flex; flex-direction: column; gap: 20px; margin: 18px 0 22px; }
  .field .lbl { display: block; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field .help { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .field input[type="text"] { width: 100%; font: 500 18px var(--font); color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px 12px; user-select: text; -webkit-user-select: text; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
  .swatch[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,193,90,0.35), inset 0 0 0 1px rgba(0,0,0,0.3); }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
  .seg button { font: 500 15px var(--font); color: var(--text); background: transparent; border: none; padding: 9px 16px; cursor: pointer; }
  .seg button + button { border-left: 1px solid rgba(255,255,255,0.2); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #2b1d00; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.18);
    position: relative; cursor: pointer; flex: none; transition: background 0.2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.2s; }
  .switch input:checked { background: var(--gold); }
  .switch input:checked::after { left: 25px; }
  .stepper { display: inline-flex; align-items: center; gap: 14px; }
  .stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
    color: var(--text); font: 600 22px var(--font); cursor: pointer; }
  .stepper output { font-size: 22px; font-weight: 600; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }

  .wallet { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; margin: 4px 0 14px; }
  .wallet svg { width: 22px; height: 22px; }
  .shop-items { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 16px; }
  .shop-item { padding: 16px 12px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .shop-item > svg { width: 58px; height: 58px; }
  .shop-item h3 { margin: 4px 0 0; font-size: 19px; font-weight: 600; }
  .shop-item p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.3; min-height: 36px; }
  .buy { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font: 600 17px var(--font); padding: 8px 18px; border-radius: 10px;
    border: none; cursor: pointer; color: #2b1d00; background: linear-gradient(180deg, #f6d77a, #d9a92c); }
  .buy svg { width: 18px; height: 18px; }
  .buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .buy.owned { background: rgba(91, 209, 139, 0.2); color: #b9f5cf; opacity: 1; }

  @media (max-height: 500px) {

function freeX(zone, deck, taken) {
  const z = ZONES[zone];
  for (let i = 0; i < 80; i++) {
    const x = rand(z.a, z.b);
    const bad =
      taken.some(t => t.deck === deck && Math.abs(t.x - x) < 70) ||
      LADDERS.some(l => (l.from === deck || l.from + 1 === deck) && Math.abs(l.x - x) < 55) ||
      SPOT_DEFS.some(s => s.deck === deck && Math.abs(s.x - x) < 60) ||
      GATE_DEFS.some(g => g.deck === deck && Math.abs(g.x - x) < 60) ||
      (deck === SHOP.deck && Math.abs(x - SHOP.x) < 90) ||
      (deck === 0 && Math.abs(x - 260) < 90);
    if (!bad) return x;
  }
  return rand(z.a, z.b);
}

function adultLook() {
  const k = pick(KIDS);
  return { skin: k.skin, hair: pick(['#5a3a22', '#1c1410', '#8a8a8a', '#a8432a', '#e0b04f']), style: pick(['short', 'long', 'bun', 'curly']),
    coat: pick(COATS), pants: '#23262d', trim: '#ddd', collar: 'buttons', hat: pick(['bowler', 'none', 'bonnet', 'cap', 'none']), hatColor: pick(['#7a2e32', '#2f4a3a', '#4f6d8f']), scale: 1.18 };
}

function newGame() {
  const slow = prefs.slow;
  G = {
    time: 0,
    tHit: rand(Math.max(10, 32 - level * 2), Math.max(18, 52 - level * 3.2)) + (slow ? 10 : 0),
    hit: false, bellRung: false, waitMsg: false, bumpMsg: false,
    water: HULL_BOTTOM + 20,
    rate: (level <= 6 ? Math.min(5.1, 3.4 * (1 + 0.1 * (level - 1))) : Math.min(6.6, 5.1 + (level - 6) * 0.38)) * (slow ? 0.6 : 1),
    coins: 0, earned: 0, cls: 3, hasKey: false, silver: false,
    hatch: level >= 6, hatchHintT: -10, hatchMsgT: -10,
    jacket: false, shoes: false, swim: null,
    gates: GATE_DEFS.map(g => ({ ...g, open: false, lift: 0, msgT: -10, hintT: -10 })),
    spots: SPOT_DEFS.map(s => ({ ...s, zone: zoneOf(s.deck, s.x), searched: false, has: null })),
    boats: BOATS.map(x => ({ x, y: FLOOR(4) - 6, leaveAt: Infinity, state: 'docked', riders: [adultLook(), adultLook(), adultLook()] })),
    items: [], parts: [], npcs: [], trail: [], shake: 0, flash: 0, endT: 0, boat: null, cam: null, tilt: 0,
  };
  player = { x: 260, y: FLOOR(0), face: 1, walkT: 0, climb: false, moving: false };

  // Coins and money bags
  const plan = { d0: [5, 0], d1: [6, 1], d2: [3, 0], w2: [3, 1], d3: [2, 0], w3: [4, 1], d4: [2, 0] };
  for (const zone in plan) {
    const [coins, bags] = plan[zone], deck = ZONES[zone].deck;
    for (let i = 0; i < coins + bags; i++) {
      G.items.push({ deck, x: freeX(zone, deck, G.items), type: i < coins ? 'coin' : 'bag', taken: false, ph: Math.random() * 6 });
    }
  }

  // The key — the better you get, the better it hides
  if (level <= 2) {
    const zone = level === 1 ? pick(['d0', 'd1']) : pick(['d1', 'd2', 'd3']);
    const deck = ZONES[zone].deck;
    G.items.push({ deck, x: freeX(zone, deck, G.items), type: 'key', taken: false, ph: 0 });
  } else if (level <= 6) {
    const want = level === 3 ? ['low', 'mid'] : level === 4 ? ['c2'] : ['c1'];
    pick(G.spots.filter(s => want.includes(s.zone))).has = 'key';
  } else G.lateKey = true; // from level 7 the key only falls into luggage when the iceberg hits
  // From level 6, a hatch on the way up needs a silver key
  if (G.hatch && level < 8) pick(G.spots.filter(s => s.zone === 'low' && !s.has)).has = 'silver';
  else if (G.hatch) G.lateSilver = true;
  for (const s of G.spots) if (!s.has) {
    const r = Math.random();
    s.has = r < 0.35 ? 'coin' : r < 0.55 ? 'bag' : null;
  }

  // A lost puppy somewhere on the ship
  const dz = pick(['d0', 'd1', 'd2', 'd3']);
  G.dog = { deck: ZONES[dz].deck, x: freeX(dz, ZONES[dz].deck, G.items), y: FLOOR(ZONES[dz].deck), face: -1, following: false, moving: false, walkT: 0 };

  // Passengers walking around
  G.npcs = NPC_ZONES.map(([deck, a, b]) => {
    const x = rand(a, b);
    return { deck, a, b, x, tx: rand(a, b), wait: rand(0, 2), face: 1, walkT: 0, moving: false, look: adultLook() };
  });
}

  const dn = $('dogName'); if (dn) dn.addEventListener('input', () => setPref('dog', dn.value.slice(0, 14)));
  const sg = $('shipSign'); if (sg) sg.addEventListener('input', () => { setPref('sign', sg.value.slice(0, 20)); if (use3D) refreshShipSign(); });
  const sm = $('slowMode'); if (sm) sm.addEventListener('change', () => setPref('slow', sm.checked));
  const mo = $('musicOpt'); if (mo) mo.addEventListener('change', () => { musicOn = mo.checked; save('titanic.music', musicOn); });
  const eo = $('endingOpt'); if (eo) eo.addEventListener('change', () => setPref('ending', eo.checked));
  const setLevel = l => { level = clamp(l, 1, 10); save('titanic.level', level); $('lvlOut').textContent = level; $('lvlNote').textContent = levelSummary(level); };
  on('lvlDown', () => setLevel(level - 1));
  on('lvlUp', () => setLevel(level + 1));
}

// ---------- Face maker ----------
function drawFacePreview() {
  const c = $('facePreview'); if (!c) return;
  const g = c.getContext('2d'); g.clearRect(0, 0, 400, 400);
  g.fillStyle = '#d9ab1c'; g.fillRect(150, 22, 100, 40);
  g.fillStyle = SKIN; g.fillRect(70, 50, 260, 300);
  const sh = g.createLinearGradient(70, 0, 330, 0); sh.addColorStop(0, 'rgba(255,255,255,0.25)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.15)');
  g.fillStyle = sh; g.fillRect(70, 50, 260, 300);
  g.fillStyle = KIDS[prefs.kid].hair; g.beginPath(); g.ellipse(200, 62, 150, 52, 0, Math.PI, 0); g.fill(); g.fillRect(50, 60, 300, 14);
  g.drawImage(faceCanvas(prefs.face), 65, 80, 270, 270);
}
function drawPad() {
  const c = $('facePad'); if (!c) return;
  const g = c.getContext('2d');
  g.fillStyle = SKIN; g.fillRect(0, 0, 288, 288);
  g.strokeStyle = 'rgba(0,0,0,0.13)'; g.setLineDash([6, 6]); g.lineWidth = 2;
  for (const x of [102, 186]) { g.beginPath(); g.arc(x, 126, 22, 0, 7); g.stroke(); }
  g.beginPath(); g.arc(144, 168, 42, 0.35, Math.PI - 0.35); g.stroke(); g.setLineDash([]);
  g.drawImage(faceLayer, 0, 0);
}
function wireFaceMaker() {
  const changed = () => { setPref('face', prefs.face); faceChanged(); drawFacePreview(); };
  const drawChips = () => cardEl.querySelectorAll('.chip').forEach(b => {
    const f = { ...prefs.face, custom: false, [b.dataset.cat]: b.dataset.val }, g = b.firstChild.getContext('2d');
    g.clearRect(0, 0, 96, 96); g.fillStyle = SKIN; g.beginPath(); g.arc(48, 48, 46, 0, 7); g.fill(); drawFace(g, f);
    b.setAttribute('aria-pressed', String(!prefs.face.custom && prefs.face[b.dataset.cat] === b.dataset.val));
  });
  cardEl.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { prefs.face[b.dataset.cat] = b.dataset.val; prefs.face.custom = false; changed(); drawChips(); }));
  cardEl.querySelectorAll('[data-ftab]').forEach(b => b.addEventListener('click', () => {
    const draw = b.dataset.ftab === 'draw';
    cardEl.querySelectorAll('[data-ftab]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    $('fParts').hidden = draw; $('fDraw').hidden = !draw;
    prefs.face.custom = draw && hasDrawing; changed(); drawChips(); drawPad();
  }));
  // the drawing pad
  let ink = '#1b1b1b', size = 7, last = null;
  const pad = $('facePad');
  cardEl.querySelectorAll('[data-ink]').forEach(b => b.addEventListener('click', () => { ink = b.dataset.ink; cardEl.querySelectorAll('[data-ink]').forEach(o => o.setAttribute('aria-pressed', String(o === b))); }));
  cardEl.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { size = +b.dataset.size; cardEl.querySelectorAll('[data-size]').forEach(o => o.setAttribute('aria-pressed', String(o === b))); }));
  const finish = () => {
    if (!last) return; last = null; hasDrawing = true; prefs.face.custom = true; award('artist');
    try { save('titanic.faceDraw', faceLayer.toDataURL('image/png')); } catch (_) {}
    changed();
  };
  $('padClear').addEventListener('click', () => { faceLayer.getContext('2d').clearRect(0, 0, 288, 288); hasDrawing = false; prefs.face.custom = false; save('titanic.faceDraw', null); changed(); drawPad(); });
  const pos = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 288, (e.clientY - r.top) / r.height * 288]; };
  const stroke = (a, b) => {
    const g = faceLayer.getContext('2d');
    g.globalCompositeOperation = ink === 'erase' ? 'destination-out' : 'source-over';
    g.strokeStyle = ink === 'erase' ? '#000' : ink; g.lineWidth = ink === 'erase' ? 26 : size; g.lineCap = g.lineJoin = 'round';
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0] + 0.01, b[1]); g.stroke(); g.globalCompositeOperation = 'source-over';
    drawPad();
  };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); last = pos(e); stroke(last, last); });
  pad.addEventListener('pointermove', e => { if (!last) return; const p = pos(e); stroke(last, p); last = p; });
  pad.addEventListener('pointerup', finish); pad.addEventListener('pointercancel', finish);
  drawChips(); drawPad(); drawFacePreview();
}

// ---------- Pause ----------
function pauseGame() {
  if (!['play', 'swim', 'dive', 'mini'].includes(state)) return;
  pausedFrom = state;
  for (const k in input) input[k] = false;
  showScreen('pause');
}
function resumeGame() {
  state = pausedFrom || 'play'; screenKind = 'none';
  screenEl.classList.add('hide');
  if (state === 'play' && G && G.hit) warnEl.style.display = 'flex';
}

// ---------- Shop ----------
function shopHTML() {
  const items = SHOP_ITEMS.map((it, i) => {
    const owned = G[it.id];
    const btn = owned ? `<button class="buy owned" disabled>Got it</button>`
      : `<button class="buy" data-buy="${it.id}" ${G.coins < it.price ? 'disabled' : ''}>${ICONS.coin}${it.price}${isTouch ? '' : ` <kbd>${i + 1}</kbd>`}</button>`;
    return `<div class="shop-item">${ICONS[it.id === 'jacket' ? 'jacket' : 'shoe']}<h3>${it.name}</h3><p>${it.desc}</p>${btn}</div>`;
  }).join('');
  return `
    <div class="eyebrow">Purser's desk</div>
    <h2>Ship shop</h2>
    <div class="wallet">${ICONS.coin}<span>You have <b>${G.coins}</b> coins</span></div>
    <div class="shop-items">${items}</div>
    <p class="lede" style="font-size:14px;margin-bottom:16px">Spending coins does not change your class.</p>
    <div class="actions"><button class="primary" id="closeShop">Back to the ship</button></div>`;
}
function openShop() {
  state = 'shop';
  for (const k in input) input[k] = false;
  document.querySelectorAll('.tbtn.on').forEach(b => b.classList.remove('on'));
  showScreen('shop');
}
function buy(id) {
  const it = SHOP_ITEMS.find(i => i.id === id);
  if (!it || G[id] || G.coins < it.price) return;
  G.coins -= it.price; G[id] = true; sfx.up();
  cardEl.innerHTML = shopHTML(); wireScreen('shop');
}
function closeShop() {
  state = 'play'; screenKind = 'none';
  screenEl.classList.add('hide');
  if (G.hit) warnEl.style.display = 'flex';
}

// ---------- Rules ----------
const deckAt = y => { for (let d = 0; d <= 4; d++) if (Math.abs(y - FLOOR(d)) < 0.6) return d; return -1; };
const classNeed = zone => zone === 'c2' ? 2 : zone === 'c1' ? 1 : 3;

function hitIceberg() {
  G.hit = true; G.shake = 1.4; G.flash = 1; G.hitAt = G.time;
  sfx.boom();
  warnEl.style.display = 'flex';
  if (G.lateKey || G.lateSilver) {
    const hide = (want, what) => {
      let c = G.spots.filter(s => !s.searched && want.includes(s.zone) && s.has !== 'key' && s.has !== 'silver' && (what !== 'silver' || s.deck === 1)); // never the boiler room, which floods first
      if (!c.length) c = G.spots.filter(s => !s.searched && s.has !== 'key' && s.has !== 'silver');
      if (c.length) pick(c).has = what;
      else G.items.push({ deck: deckAt(player.y) >= 0 ? deckAt(player.y) : 1, x: freeX('d1', 1, G.items), type: 'key', taken: false, ph: 0 });
    };
    if (G.lateKey) hide(level >= 9 ? ['c1'] : ['c2', 'c1'], 'key');
    if (G.lateSilver) hide(['low'], 'silver');
    msg(G.lateSilver ? 'CRASH! Both keys fell into luggage somewhere! Find them before the water does!' : 'CRASH! The key fell into somebody\'s luggage! Find it before the water does!', 6, 'ice');
  } else msg('We hit an iceberg! Go up to a lifeboat before the water touches you!', 6, 'ice');
  for (let i = 0; i < 30; i++) G.parts.push({ k: 'ice', x: BOW_X - rand(0, 80), y: rand(560, 760), vx: rand(-60, 60), vy: rand(-140, -40), life: 1.2, s: rand(3, 6) });
  // more passengers come running
  for (const [deck, a, b] of [[1, 180, 2220], [2, 180, 1350], [3, 180, 850], [1, 180, 2220]]) G.npcs.push({ deck, a, b, x: rand(a, b), tx: rand(a, b), wait: 0, face: 1, walkT: 0, moving: false, look: adultLook(), panic: true });
  // From level 4 the first two lifeboats leave early (the last one always waits)
  if (level >= 4) {
    const first = (level >= 9 ? 42 : 55) * (prefs.slow ? 1.5 : 1);
    G.boats[0].leaveAt = G.time + first;
    G.boats[1].leaveAt = G.time + first + 35;
  }
}

function setClass() {
  const c = G.earned >= COST_1ST ? 1 : G.earned >= COST_2ND ? 2 : 3;
  if (c < G.cls) {
    G.cls = c; sfx.up();
    msg(c === 2 ? 'Hooray! You are 2nd Class now!' : 'Wow! You are 1st Class now!', 3.5, 'coin');
    for (let i = 0; i < 16; i++) G.parts.push({ k: 'spark', x: player.x, y: player.y - 40, vx: rand(-140, 140), vy: rand(-200, -60), life: 1, s: rand(4, 8) });
  }
}

function addMoney(n, x, y) {
  G.coins += n; G.earned += n;
  sfx.coin();
  G.parts.push({ k: 'text', x, y: y - 50, vx: 0, vy: -50, life: 1, t: '+' + n });
  setClass();
}

function gotKey(x, y, silver) {
  sfx.key();
  if (silver) { G.silver = true; msg('You found the silver key! It opens the hatch.', 5, 'keySilver'); }
  else { G.hasKey = true; msg('You found the key! Now go up to the lifeboats.', 5, 'keyGold'); }
  for (let i = 0; i < 18; i++) G.parts.push({ k: 'spark', x, y: y - 30, vx: rand(-140, 140), vy: rand(-180, -40), life: 1.1, s: rand(4, 9) });
}

function tryGate(g) {
  const ok = g.need === 'key' ? G.hasKey : G.cls <= g.need;
  if (ok) {
    g.open = true; sfx.open();
    msg(g.need === 'key' ? 'The gate is open! Get in a lifeboat!' : g.need === 2 ? 'Welcome to the 2nd Class Lounge!' : 'Welcome to the 1st Class Ballroom!', 3.5, 'open');
    return true;
  }
  g.hintT = G.time;
  if (G.time - g.msgT > 4) {
    g.msgT = G.time; sfx.nope();
    if (g.need === 'key') msg('Locked! You need the key. It is hidden somewhere on the ship.', 3.5, 'lock');
    else if (g.need === 2) msg(`2nd Class only! Collect ${COST_2ND} coins to come in.`, 3.5, 'coin');
    else msg(`1st Class only! Collect ${COST_1ST} coins to come in.`, 3.5, 'coin');
  }
  return false;
}

function movePlayer(dt) {
  player.moving = false;
  const boost = G.shoes ? 1.35 : 1;
  const near = l => Math.abs(player.x - l.x) < 40;
  let lad = null;
  if (input.up) lad = LADDERS.find(l => near(l) && player.y > FLOOR(l.from + 1) + 0.5 && player.y <= FLOOR(l.from) + 0.5);
  if (!lad && input.down) lad = LADDERS.find(l => near(l) && player.y < FLOOR(l.from) - 0.5 && player.y >= FLOOR(l.from + 1) - 0.5);
  // the locked hatch (level 6+)
  if (lad && lad.x === HATCH_LADDER && G.hatch && input.up && player.y >= FLOOR(2) - 0.5) {
    if (G.silver) { G.hatch = false; sfx.open(); msg('The hatch is open!', 3, 'open'); }
    else {
      lad = null; G.hatchHintT = G.time;
      if (G.time - G.hatchMsgT > 4) { G.hatchMsgT = G.time; sfx.nope(); msg('The hatch is locked! Find the silver key.', 3.5, 'keySilver'); }
    }
  }
  if (lad) {
    player.x += (lad.x - player.x) * Math.min(1, dt * 15);
    if (input.up) player.y = Math.max(FLOOR(lad.from + 1), player.y - CLIMB * boost * dt);
    else player.y = Math.min(FLOOR(lad.from), player.y + CLIMB * boost * dt);
    player.walkT += dt; player.moving = true;
  }
  const d = deckAt(player.y);
  player.climb = d < 0;
  if (d < 0 || lad) return;

  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (!dir) return;
  // passengers slow you down from level 3
  let crowd = 1;
  if (level >= 3 && G.npcs.some(n => n.deck === d && Math.abs(n.x - player.x) < 26)) {
    crowd = level >= 9 ? 0.45 : 0.6;
    if (!G.bumpMsg) { G.bumpMsg = true; msg('Excuse me! Passengers are in the way.', 2.5, 'people'); }
  }
  player.face = dir; player.walkT += dt; player.moving = true;
  let nx = player.x + dir * SPEED * boost * crowd * dt;
  nx = d === 4 ? clamp(nx, BOAT_L + 24, BOAT_R - 24) : clamp(nx, IN_L + 24, IN_R - 24);
  for (const g of G.gates) {
    if (g.deck !== d || g.open) continue;
    if (player.x <= g.x - 22 + 0.01 && nx > g.x - 22) {
      if (!tryGate(g)) nx = g.x - 22;
    }
  }
  player.x = nx;
}

function interact() {
  const d = deckAt(player.y);
  // pick things up just by walking over them
  for (const it of G.items) {
    if (it.taken || it.deck !== d || Math.abs(it.x - player.x) > 32) continue;
    it.taken = true;
    if (it.type === 'coin') addMoney(1, it.x, FLOOR(d));
    else if (it.type === 'bag') addMoney(3, it.x, FLOOR(d));
    else gotKey(it.x, FLOOR(d));
  }
  // the puppy
  if (!G.dog.following && d === G.dog.deck && Math.abs(G.dog.x - player.x) < 40) {
    G.dog.following = true; sfx.pup();
    msg(`You found ${dogName()}! Bring them to the lifeboat.`, 4, 'dog');
    for (let i = 0; i < 10; i++) G.parts.push({ k: 'heart', x: G.dog.x, y: G.dog.y - 30, vx: rand(-60, 60), vy: rand(-120, -60), life: 1.1, s: rand(5, 8) });
  }
  // search or shop
  if (actionQueued) {
    actionQueued = false;
    const s = G.spots.find(s => !s.searched && s.deck === d && Math.abs(s.x - player.x) < 48);
    if (s) {
      s.searched = true; sfx.search();
      if (s.has === 'key') gotKey(s.x, FLOOR(d));
      else if (s.has === 'silver') gotKey(s.x, FLOOR(d), true);
      else if (s.has === 'coin') addMoney(1, s.x, FLOOR(d));
      else if (s.has === 'bag') addMoney(3, s.x, FLOOR(d));
      else msg('Nothing in here!', 1.6);
    } else if (d === SHOP.deck && Math.abs(SHOP.x - player.x) < 60) {
      openShop(); return;
    } else if (nearDoor(d)) {
      useDoor(); return;
    }
  }
  // lifeboats
  if (d === 4 && G.gates[2].open) {
    const b = G.boats.find(b => b.state === 'docked' && Math.abs(b.x - player.x) < 70);
    if (b) {
      if (G.hit) boardBoat(b);
      else if (!G.waitMsg) {
        G.waitMsg = true;
        G.tHit = Math.min(G.tHit, G.time + 5);
        msg('The lifeboats leave after the iceberg. Wait here!', 3.5, 'boat');
      }
    }
  }
}

function updateWorld(dt) {
  // passengers stroll, then hurry after the iceberg (and head upstairs when their deck floods)
  G.npcs = G.npcs.filter(n => G.water > FLOOR(n.deck) + 2);
  for (const n of G.npcs) {
    n.moving = false;
    if (n.wait > 0) { n.wait -= dt; continue; }
    const dx = n.tx - n.x, sp = G.hit ? 150 : 35;
    n.panic = G.hit;
    if (Math.abs(dx) < 4 || (G.hit && Math.random() < dt * 0.6)) { n.tx = rand(n.a, n.b); n.wait = G.hit ? rand(0, 0.25) : rand(1, 3); continue; }
    n.face = Math.sign(dx); n.x += n.face * Math.min(Math.abs(dx), sp * dt); n.moving = true; n.walkT += dt * (G.hit ? 2 : 0.8);
  }
  // the puppy follows your footsteps
  if (player.moving) {
    G.trail.push({ x: player.x, y: player.y, face: player.face });
    if (G.trail.length > 40) G.trail.shift();
  }
  if (G.dog.following) {
    const p = G.trail.length > 22 ? G.trail[G.trail.length - 22] : null;
    G.dog.moving = player.moving && !!p;
    if (p) { G.dog.x = p.x; G.dog.y = p.y; G.dog.face = p.face; }
    if (G.dog.moving) G.dog.walkT += dt;
  }
  // lifeboats leaving early
  for (const b of G.boats) {
    if (b.state === 'docked' && G.time >= b.leaveAt) {
      b.state = 'leaving';
      msg('A lifeboat just left! Hurry!', 3.5, 'boat');
    } else if (b.state === 'leaving') {
      const sea = seaY();
      const bt = shipYAt(b.x, sea - 2);
      if (b.y < bt - 0.5) b.y = Math.min(bt, b.y + 70 * dt);
      else { b.y = bt; b.x += 40 * dt; if (b.x > WORLD_W + 200) b.state = 'gone'; }
    }
  }
  // the ship tips bow-first as it fills
  if (G.hit) G.tilt = Math.min(0.045, (G.time - G.hitAt) * 0.0005);
}

function win(b) {
  state = 'winning'; G.endT = 0;
  b.state = 'taken';
  G.boat = { x: b.x, y: FLOOR(4) - 4 };
  warnEl.style.display = 'none';
  sfx.win();
  msg(G.dog.following ? `All aboard! You and ${dogName()} made it!` : 'All aboard! You made it!', 4, 'boat');
  level++; save('titanic.level', level);
  escapeStickers();
  const colors = ['#e8c15a', '#5aa9e6', '#e5484d', '#5bd18b', '#f4f1e8'];
  for (let i = 0; i < 60; i++) G.parts.push({ k: 'confetti', x: b.x + rand(-120, 120), y: FLOOR(4) - rand(80, 200), vx: rand(-80, 80), vy: rand(-160, 0), life: rand(2, 3.5), c: pick(colors), r: rand(0, 6) });
}

function escapeStickers() {
  award('survivor');
  if (G.dog.following) award('puppy');
  if (G.cls === 1) award('fancy');
  if (level >= 5) award('salt');
  if (level >= 10) award('captain');
}
function lose() {
  state = 'sinking'; G.endT = 0;
  warnEl.style.display = 'none';
  sfx.splash(); setTimeout(sfx.lose, 500);
  for (let i = 0; i < 18; i++) G.parts.push({ k: 'drop', x: player.x, y: G.water, vx: rand(-90, 90), vy: rand(-220, -80), life: 1, s: rand(3, 6) });
  if (G.p2) G.pl.forEach(p => { p.aboard = false; });
}

function update(dt) {
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.classList.remove('show'); }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) toastEl.classList.remove('show'); }
  if (MG) { if (state === 'mini') { MG.t += dt; MG.update(dt); } return; }
  if (!G || state === 'shop' || state === 'paused') return;
  for (const p of G.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'confetti') { p.vy = Math.min(p.vy + 160 * dt, 70); p.vx *= 0.99; p.r += dt * 6; }
    else if (p.k === 'heart') p.vy += 60 * dt;
    else if (p.k !== 'text') p.vy += 260 * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  G.shake = Math.max(0, G.shake - dt);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  for (const g of G.gates) g.lift += ((g.open ? 1 : 0) - g.lift) * Math.min(1, dt * 5);

  if (state === 'play') {
    G.time += dt;
    if (!G.bellRung && G.time > G.tHit - 6) {
      G.bellRung = true; sfx.bell();
      msg('Ding ding ding! Iceberg ahead!', 3.5, 'bell');
    }
    if (!G.hit && G.time >= G.tHit) hitIceberg();
    if (G.hit) G.water -= G.rate * dt;
    if (!player.aboard && !player.wet) movePlayer(dt);
    if (G.p2) withP2(() => { if (!player.aboard && !player.wet) movePlayer(dt); });
    updateWorld(dt);
    if (!player.aboard && !player.wet) interact();
    if (G.p2 && state === 'play') withP2(() => { if (!player.aboard && !player.wet) interact(); });
    if (!G.p2) {
      if (state === 'play' && G.water < player.y - 2) { if (G.jacket) startJump('float'); else lose(); }
    } else if (state === 'play') {
      for (const pl of G.pl) {
        if (pl.wet) { pl.y = G.water + 6 + Math.sin(G.time * 3) * 2; pl.moving = false; continue; }
        if (!pl.aboard && G.water < pl.y - 2 && state === 'play') wetPlayer(pl);
      }
    }
  } else if (state === 'winning') {
    G.endT += dt;
    G.water = Math.max(FLOOR(4) + 20, G.water - G.rate * 3 * dt); // the ship keeps filling while you're lowered
    updateWorld(dt);
    const sea = seaY();
    const bt = shipYAt(G.boat.x, sea - 2);
    if (G.boat.y < bt - 0.5) G.boat.y = Math.min(bt, G.boat.y + 110 * dt);
    else { G.boat.y = bt; G.boat.x -= 50 * dt; } // once afloat, stay on the surface
    if (G.endT > 6.5) finishEscape();
  } else if (state === 'sinking') {
    G.endT += dt;
    player.y += 25 * dt;
    if (G.endT > 1.8) showScreen('lose');
  } else if (state === 'jumping') updateJump(dt);
  else if (state === 'swim') updateSwim(dt);
  else if (state === 'swimwin') { G.endT += dt; swimDrift(dt); if (G.endT > 3) finishEscape(); }

function updateDive(dt) {

}

}

function camFocus() {

const MINIS = {
  // ---------------------------------------------------------------
  // 1. Boarding day: stack suitcases with the crane
  boarding() {
    const DECK = 470, PL = 340, PR = 620, GOAL = 8;
    const COLORS = ['#8b5a2b', '#c91a09', '#1e5aa8', '#2f5a44', '#d9a52b', '#7a3b6e'];
    const S = { stack: [], hookX: 480, dir: 1, carry: null, drop: null, next: 0.4, misses: 0, done: false, endT: 0, pops: [] };
    const newCase = () => ({ w: rand(96, 140), h: 32, c: pick(COLORS) });
    const top = () => S.stack.length ? S.stack[S.stack.length - 1] : { x: (PL + PR) / 2, w: PR - PL, y: DECK };
    const end = () => {
      if (S.won && S.misses === 0) award('packer');
      miniResult('boarding', S.won, { coins: S.stack.length, title: S.won ? 'All aboard!' : 'Splash!',
        text: S.won ? (S.misses ? `You loaded all ${GOAL} suitcases. ${S.misses} fell in the sea, but that's OK!` : 'You loaded every suitcase and not one fell in the sea!')
          : 'Three suitcases fell in the sea. Drop each one when it is right over the pile.' });
    };
    return {
      S, icon: 'suitcase', intro: `Press Space (or tap) to drop each suitcase onto the ship. Stack ${GOAL}!`,
      action() { if (S.drop || S.done || !S.carry) return; S.drop = { ...S.carry, x: S.hookX, y: 132, vy: 0 }; S.carry = null; sfx.search(); },
      tap() { this.action(); },
      update(dt) {
        if (S.done) { S.endT += dt; if (S.endT > 1.8 && !this.finished) end(); return; }
        const sp = 190 + S.stack.length * 26;
        S.hookX += S.dir * sp * dt; if (S.hookX > 820) S.dir = -1; if (S.hookX < 160) S.dir = 1;
        if (!S.carry && !S.drop) { S.next -= dt; if (S.next <= 0) S.carry = newCase(); }
        const d = S.drop;
        if (d) {
          d.vy += 1600 * dt; d.y += d.vy * dt;
          const tp = top();
          if (!d.miss && d.y + d.h >= tp.y) {
            if (Math.abs(d.x - tp.x) <= tp.w / 2 - 4) {
              const off = Math.abs(d.x - tp.x);
              S.stack.push({ x: d.x, w: d.w, h: d.h, c: d.c, y: tp.y - d.h, squash: 1 }); S.drop = null; S.next = 0.35; sfx.coin();
              popText(S.pops, off < 12 ? 'Perfect!' : 'Good!', d.x, tp.y - 50);
              if (S.stack.length >= GOAL) { S.done = true; S.won = true; sfx.win(); msg('All the suitcases are on board!', 3, 'suitcase'); }
            } else {
              d.miss = true; d.vx = Math.sign(d.x - tp.x) * 180; S.misses++; sfx.nope();
              popText(S.pops, 'Oops!', d.x, tp.y - 40, '#ff8a8a');
              if (S.misses >= 3) { S.done = true; S.won = false; }
            }
          }
          if (d.miss) { d.x += d.vx * dt; d.rot = (d.rot || 0) + dt * 5 * Math.sign(d.vx); if (d.y > 600) { S.drop = null; S.next = 0.35; sfx.splash(); } }
        }
        for (const s of S.stack) s.squash = Math.max(0, s.squash - dt * 5);
      },
      draw(t, W, H) {
        screenFill(W, H, '#7cc4ea', '#d8f0ff');
        const v = mview(W, H); VIEW = null;
        cx.fillStyle = '#fff6c2'; circle(820, 110, 40); cx.fill();
        for (const [x, y, sc] of [[160, 130, 0.8], [440, 90, 0.65], [700, 160, 0.9]]) drawCloud(x + Math.sin(t * 0.2) * 10, y, sc, 0);
        // sea and the dock
        cx.fillStyle = '#2a78c8'; cx.fillRect(v.x0, 500, v.x1 - v.x0, v.y1 - 500); waterStuds(v.x0, v.x1, 500, t, '#4f97de');
        brickWall(v.x0, 430, 200 - v.x0, 110, '#8d99a6'); studRow(v.x0, 430, 200 - v.x0, '#8d99a6');
        for (const [x, c, h] of [[40, '#c91a09', 'cap'], [95, '#1e5aa8', 'bonnet'], [150, '#2f5a44', 'bowler']]) drawPerson(x, 430, { skin: SKIN, hair: '#5a3a22', style: 'short', coat: c, pants: '#23262d', trim: '#ddd', collar: 'buttons', hat: h, hatColor: '#f2cd37', face: 1, walkT: t, moving: false });
        // the ship
        brickWall(250, DECK + 10, v.x1 - 250, 80, '#25282e'); brick(250, DECK + 60, v.x1 - 250, 12, '#d0302a', false);
        brick(250, DECK, v.x1 - 250, 12, '#e2c693', true);
        brick(PL, DECK - 6, PR - PL, 8, '#8a5a30', true);
        cx.fillStyle = '#f5a623'; cx.fillRect(760, 260, 70, DECK - 260); cx.fillStyle = '#1c1c1c'; cx.fillRect(760, 260, 70, 26);
        for (let x = 260; x < v.x1; x += 40) { cx.fillStyle = 'rgba(255,225,150,0.9)'; cx.fillRect(x, DECK + 30, 10, 10); }
        // crane
        brick(70, 40, 24, 400, '#f2cd37', false); brick(40, 40, 860, 22, '#f2cd37', true);
        for (let x = 60; x < 880; x += 40) { cx.strokeStyle = 'rgba(0,0,0,0.25)'; cx.lineWidth = 2; line(x, 40, x + 20, 62); }
        cx.fillStyle = '#4a4f57'; rr(S.hookX - 22, 62, 44, 16, 4); cx.fill();
        cx.strokeStyle = '#333'; cx.lineWidth = 3; line(S.hookX, 78, S.hookX, 122);
        cx.strokeStyle = '#555'; cx.lineWidth = 4; cx.beginPath(); cx.arc(S.hookX, 126, 6, 0, Math.PI); cx.stroke();
        if (S.carry) drawCase(S.hookX, 132, S.carry.w, S.carry.h, S.carry.c, Math.sin(t * 3) * 0.04);
        if (!S.carry && !S.drop && !S.done) { cx.globalAlpha = 0.4; drawCase(S.hookX, 132, 110, 32, '#888'); cx.globalAlpha = 1; }
        // the pile
        for (const s of S.stack) drawCase(s.x, s.y + s.squash * 3, s.w, s.h - s.squash * 3, s.c);

    };

  // ---------------------------------------------------------------
  // 2. Shovel the coal: a rhythm game
  coal() {
    const TX = 720, BELT = 410, S = { lumps: [], spawn: 0.8, steam: 0, time: 45, swing: 0, flyers: [], done: false, endT: 0, pops: [], streak: 0 };
    const end = () => {
      if (S.won) award('steam');
      miniResult('coal', S.won, { coins: S.won ? 6 : Math.round(S.steam / 20), title: S.won ? 'Full steam ahead!' : 'Out of time!',
        text: S.won ? 'The Titanic is going full speed across the ocean!' : `You got the ship to ${Math.round(S.steam * 0.23)} knots. Press Space when a lump of coal is inside the gold ring.` });
    };
    return {
      S, icon: 'flame', intro: 'Press Space (or tap) when the coal is in the gold ring to shovel it in!',
      action() {
        if (S.done) return;
        S.swing = 1;
        let best = null;
        for (const l of S.lumps) if (!l.hit && !l.fall && (!best || Math.abs(l.x - TX) < Math.abs(best.x - TX))) best = l;
        if (best && Math.abs(best.x - TX) < 46) {
          const perfect = Math.abs(best.x - TX) < 20;
          best.hit = true; S.steam = Math.min(100, S.steam + (perfect ? 8 : 5)); S.streak++;
          S.flyers.push({ x: best.x, y: BELT - 14, t: 0, s: best.s });
          popText(S.pops, perfect ? 'Perfect!' : 'Good!', TX, BELT - 90);
          tone(perfect ? 784 : 659, 0.12, 'sine', 0.07);
          if (S.steam >= 100) { S.done = true; S.won = true; sfx.win(); msg('Full speed!', 2.5, 'flame'); }
        } else { S.steam = Math.max(0, S.steam - 2); S.streak = 0; popText(S.pops, 'Whoosh!', TX, BELT - 80, '#c8d4e8'); }
      },
      tap() { this.action(); },
      update(dt) {
        S.swing = Math.max(0, S.swing - dt * 4);
        if (S.done) { S.endT += dt; if (S.endT > 1.8 && !this.finished) end(); return; }
        S.time -= dt;
        if (S.time <= 0) { S.time = 0; S.done = true; S.won = false; return; }
        S.spawn -= dt;
        if (S.spawn <= 0) { S.lumps.push({ x: 40, s: rand(22, 28), rot: rand(0, 6) }); S.spawn = rand(0.6, 1.05) - S.steam * 0.002; }
        const sp = 230 + S.steam * 1.3;
        for (const l of S.lumps) {
          if (l.hit) continue;
          if (l.fall) { l.vy += 900 * dt; l.y += l.vy * dt; l.x += 60 * dt; continue; }
          l.x += sp * dt; l.rot += dt * 3;
          if (l.x > TX + 50) { l.fall = true; l.y = BELT - 12; l.vy = 0; S.steam = Math.max(0, S.steam - 3); S.streak = 0; popText(S.pops, 'Missed!', TX + 40, BELT - 70, '#ff8a8a'); }
        }
        S.lumps = S.lumps.filter(l => !l.hit && !(l.fall && l.y > 600));
        for (const f of S.flyers) f.t += dt * 2.2;
        S.flyers = S.flyers.filter(f => f.t < 1);
      },
      draw(t, W, H) {
        screenFill(W, H, '#5f6670', '#3b3f45');
        const v = mview(W, H); VIEW = null;
        brickWall(v.x0, 0, v.x1 - v.x0, 470, '#7a828d');

        const fg = cx.createLinearGradient(0, 280, 0, 390); fg.addColorStop(0, `rgba(255,${200 + heat * 40},80,1)`); fg.addColorStop(1, '#d9480f');

        // target ring

        text: S.won ? `You rang the bell in ${S.found.toFixed(1)} seconds! Next time you escape the ship, the iceberg only scrapes it, so the water rises more slowly.`

      S, icon: 'bell', intro: 'Use ← → to look around. When you see the iceberg, press Space to ring the bell!',

          else { cx.fillStyle = '#1a1a1a'; cx.fillRect(x - 40, HZ - 10, 80, 10); cx.fillRect(x - 10, HZ - 24, 12, 14); cx.fillStyle = '#ffd98a'; for (let i = 0; i < 6; i++) cx.fillRect(x - 34 + i * 12, HZ - 7, 4, 3); }

  // ---------------------------------------------------------------
  // 4. Radio for help: copy the light pattern
  radio() {
    const PADS = [{ x: 480, y: 170, c: '#e5484d', f: 523 }, { x: 600, y: 290, c: '#f2cd37', f: 659 }, { x: 480, y: 410, c: '#3bb273', f: 784 }, { x: 360, y: 290, c: '#3b82f6', f: 988 }];

    const grow = () => { while (S.seq.length < LENS[S.round]) S.seq.push(Math.floor(Math.random() * 4)); S.phase = 'show'; S.showI = 0; S.timer = 0.5; S.got = 0; };
    const flash = i => { S.lit = i; S.litT = 0.38; tone(PADS[i].f, 0.3, 'sine', 0.09); };
    const end = () => {
      if (S.won) award('sparks');
      miniResult('radio', S.won, { coins: S.won ? 6 : S.round, title: S.won ? 'Help is on the way!' : 'The signal got lost',
        text: S.won ? 'The rescue ship Carpathia heard your call and is steaming toward you!' : 'Watch the lights, then press the same ones in the same order.' });
    };
    const press = i => {
      if (S.phase !== 'input' || S.done) return;
      flash(i);
      S.tape += i % 2 ? '— ' : '· ';
      if (S.seq[S.got] === i) {
        S.got++;
        if (S.got === S.seq.length) {
          S.round++; popText(S.pops, 'Got it!', 480, 290);
          if (S.round >= LENS.length) { S.done = true; S.won = true; S.phase = 'done'; setTimeout(() => sfx.win(), 300); }

        S.mistakes++; sfx.nope(); popText(S.pops, 'Oops! Watch again', 480, 290, '#ff8a8a');

        else { S.phase = 'wait'; S.timer = 1.3; S.replay = true; }
      }
    };
    return {
      S, icon: 'radio', intro: 'Watch the lights, then copy them with the arrow keys (or tap the lights)!',

        // the radio panel

        for (const [x, y] of [[300, 120], [660, 120], [300, 460], [660, 460]]) { cx.fillStyle = '#8d99a6'; circle(x, y, 6); cx.fill(); }

  // ---------------------------------------------------------------
  // 7. Row to the rescue: steer through the ice, pick up swimmers
  row() {
    const GOAL = 3600, S = { x: 480, vx: 0, y: 0, time: 120, floes: [], swimmers: [], saved: 0, bump: 0, shake: 0, done: false, endT: 0, pops: [], riders: [] };
    for (let y = 380; y < GOAL - 300; y += rand(220, 290)) {
      const n = 1 + Math.floor(Math.random() * 2), gap = rand(140, 820);
      for (let i = 0; i < n; i++) { let x; let tries = 0; do { x = rand(60, 900); } while (Math.abs(x - gap) < 130 && tries++ < 20); S.floes.push({ x, y: y + rand(-30, 30), r: rand(40, 70), a: rand(0, 1.5) }); }
    }
    for (let i = 0; i < 5; i++) {
      const y = 500 + i * 620 + rand(-80, 80);
      let x, tries = 0; do { x = rand(90, 870); } while (S.floes.some(f => Math.hypot(f.x - x, f.y - y) < f.r + 50) && tries++ < 40);
      S.swimmers.push({ x, y, got: false, ph: rand(0, 6), look: adultLook() });
    }
    const end = () => {
      if (S.won && S.saved === 5) award('rescuer');
      miniResult('row', S.won, { coins: S.won ? 3 + S.saved * 2 : S.saved, title: S.won ? 'Rescued!' : 'The sun came up',
        text: S.won ? `You rowed to the Carpathia and saved ${S.saved} of 5 swimmers!` : 'Row with ↑ to go faster, and steer around the ice so you don\'t get stuck.' });
    };
    return {
      S, icon: 'boat', intro: 'Row to the rescue ship before sunrise! ← → steer, ↑ rows faster. Pick up swimmers on the way.',
      tap(x) { S.vx += x < 480 ? -160 : 160; },
      action() {},
      update(dt) {
        S.shake = Math.max(0, S.shake - dt);
        if (S.done) { S.endT += dt; if (S.won) S.y += 40 * dt; if (S.endT > 2 && !this.finished) end(); return; }
        S.time -= dt; if (S.time <= 0) { S.time = 0; S.done = true; S.won = false; return; }
        const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        S.vx += (dir * 260 - S.vx) * Math.min(1, dt * 4);
        S.x = clamp(S.x + S.vx * dt, 50, 910);
        let sp = input.up ? 175 : input.down ? 50 : 105;
        if (S.bump > 0) { S.bump -= dt; sp *= 0.15; }
        S.y += sp * dt;
        for (const f of S.floes) {
          const d = Math.hypot(f.x - S.x, f.y - S.y);
          if (d < f.r * 0.85 + 24) { S.y -= 12; S.x += Math.sign(S.x - f.x || 1) * 10; S.vx = Math.sign(S.x - f.x || 1) * 220; S.bump = 0.35; S.shake = 0.3; sfx.nope(); break; }
        }
        for (const s of S.swimmers) if (!s.got && Math.hypot(s.x - S.x, s.y - S.y) < 52) {
          s.got = true; S.saved++; S.riders.push(s.look); sfx.pup(); popText(S.pops, 'Saved!', 480, 300);
        }
        if (S.y >= GOAL) { S.done = true; S.won = true; sfx.win(); msg('You made it to the rescue ship!', 3, 'boat'); }
      },
      draw(t, W, H) {
        const dawn = 1 - S.time / 120;
        screenFill(W, H, mixColor('#173f7a', '#3a80cc', dawn), mixColor('#0d2c5c', '#2a6cb5', dawn));
        const v = mview(W, H); VIEW = null;
        const sh = S.shake ? rand(-4, 4) : 0;
        cx.translate(sh, 0);
        const Y = y => 420 - (y - S.y);
        // studded sea
        for (let y = Math.floor((S.y - 200) / 32) * 32; y < S.y + 600; y += 32) for (let x = 16; x < 960; x += 32) { cx.fillStyle = 'rgba(255,255,255,0.08)'; circle(x, Y(y), 7); cx.fill(); }
        // rescue ship at the top
        const gy = Y(GOAL + 60);

          brick(v.x0, gy - 120, v.x1 - v.x0, 120, '#1f2228', true); brick(v.x0, gy - 20, v.x1 - v.x0, 20, '#c91a09', false);
          cx.fillStyle = '#c91a09'; cx.fillRect(560, gy - 230, 70, 110); cx.fillStyle = '#111'; cx.fillRect(560, gy - 230, 70, 22);
          brick(300, gy - 160, 400, 40, '#f4f4f4', true);
          for (let x = 40; x < 940; x += 40) { cx.fillStyle = '#ffe1a0'; circle(x, gy - 70, 6); cx.fill(); }
          cx.fillStyle = '#f2cd37'; cx.font = `700 22px ${FONT}`; cx.textAlign = 'center'; try { cx.letterSpacing = '4px'; } catch (e) {} cx.fillText('CARPATHIA', 480, gy - 96); try { cx.letterSpacing = '0px'; } catch (e) {}
          cx.strokeStyle = '#d9b77e'; cx.lineWidth = 3; for (let i = 0; i < 6; i++) line(470, gy - 10 + i * 12, 490, gy - 10 + i * 12);

        }
        // ice
        for (const f of S.floes) {
          const y = Y(f.y); if (y < -120 || y > 680) continue;

    const end = () => {

    };
    const clawTip = () => { const A = S.arm; if (!A) return { x: S.x + S.face * 30, y: S.y + 34 }; const k = A.phase === 'out' ? A.k : 1 - A.k; return { x: S.x + S.face * 30 + (A.tx - (S.x + S.face * 30)) * k, y: S.y + 34 + (A.ty - (S.y + 34)) * k }; };

      else if (o.id === 'key') drawKey(0, 0, 0.9, 0);

      else if (o.id === 'cup') { cx.fillStyle = '#ffffff'; cx.beginPath(); cx.moveTo(-14, -10); cx.lineTo(14, -10); cx.quadraticCurveTo(12, 12, 0, 12); cx.quadraticCurveTo(-12, 12, -14, -10); cx.fill(); cx.strokeStyle = '#ffffff'; cx.lineWidth = 3; cx.beginPath(); cx.arc(16, -2, 6, -1.2, 1.2); cx.stroke(); cx.fillStyle = '#1e5aa8'; cx.fillRect(-12, -6, 24, 3); }
      else { cx.fillStyle = '#d4af37'; circle(0, 0, 15); cx.fill(); cx.fillStyle = '#fbf5e0'; circle(0, 0, 11); cx.fill(); cx.strokeStyle = '#333'; cx.lineWidth = 2; line(0, 0, 0, -8); line(0, 0, 6, 2); cx.fillStyle = '#d4af37'; cx.fillRect(-3, -19, 6, 5); }
      cx.restore();
    };
    return {
      S, T, drawT: (o, x, y, s) => drawTreasure(o, x, y, s), icon: 'chest', intro: 'Steer with the arrows. Press Space near something shiny to grab it with the claw. Keep away from the sharks!',
      action() { // reach the claw out to the treasure; it closes, then lifts it back to the submarine
        const o = near(); if (!o || S.done || S.arm) return;
        S.arm = { o, phase: 'out', k: 0, tx: o.x, ty: o.y, grip: 0 }; sfx.search();
      },
      tap() { this.action(); },
      update(dt) {
        S.hurt = Math.max(0, S.hurt - dt);
        // the claw
        const A = S.arm;
        if (A) {
          if (A.phase === 'out') { A.k += dt * 2.6; if (A.k >= 1) { A.k = 0; A.phase = 'grab'; tone(220, 0.12, 'sine', 0.08); } }
          else if (A.phase === 'grab') { A.grip = Math.min(1, A.grip + dt * 5); A.k += dt * 3; if (A.k >= 1) { A.k = 0; A.phase = 'in'; } }
          else if (A.phase === 'in') {
            A.k += dt * 1.8;
            if (A.k >= 1) {
              const o = A.o; S.arm = null; o.got = true; sfx.key(); popText(S.pops, 'Found it!', S.x, S.y - 50); msg(`You found ${o.name}!`, 2.5, 'chest');
              if (T.every(t2 => t2.got)) { S.done = true; S.won = true; setTimeout(() => sfx.win(), 400); }
            }
          }
        }
        // sharks patrol, and chase you when you swim close
        for (const k of S.sharks) {
          k.cool = Math.max(0, k.cool - dt);
          const d = Math.hypot(S.x - k.x, S.y - k.y);
          k.chase = d < 330 && !S.done && k.cool <= 0;
          let tx, ty, sp;
          if (k.chase) { tx = S.x; ty = S.y; sp = 150; }
          else { tx = k.hx + Math.sin(this.t * 0.4 + k.hx) * 260; ty = k.hy + Math.sin(this.t * 0.7 + k.hx) * 60; sp = 70; }
          const dx = tx - k.x, dy = ty - k.y, l = Math.hypot(dx, dy) || 1;
          k.vx += (dx / l * sp - k.vx) * Math.min(1, dt * 1.8); k.vy += (dy / l * sp - k.vy) * Math.min(1, dt * 1.8);
          k.x += k.vx * dt; k.y = clamp(k.y + k.vy * dt, 90, FLOORY - 180);
          if (Math.abs(k.vx) > 10) k.face = Math.sign(k.vx);
          if (d < 62 && S.hurt <= 0 && !S.done) {
            S.hp--; S.hurt = 1.5; k.cool = 3; S.vx = (S.x - k.x) * 4; S.vy = (S.y - k.y) * 4; sfx.nope();
            if (S.arm && S.arm.phase !== 'in') S.arm = null; // the bump knocks the claw loose
            popText(S.pops, 'Chomp!', S.x, S.y - 50, '#ff8a8a');
            if (S.hp <= 0) { S.done = true; S.won = false; }

          }
        }
        const ax = (input.right ? 1 : 0) - (input.left ? 1 : 0), ay = (input.down ? 1 : 0) - (input.up ? 1 : 0);
        const hold = S.arm ? 0.15 : 1; // stay still while the claw works
        S.vx += (ax * 230 * hold - S.vx) * Math.min(1, dt * 2.5); S.vy += (ay * 170 * hold - S.vy) * Math.min(1, dt * 2.5);
        S.x = clamp(S.x + S.vx * dt, 60, WW - 60); S.y = clamp(S.y + S.vy * dt, 80, FLOORY - 40);
        if (Math.abs(S.vx) > 20 && !S.arm) S.face = Math.sign(S.vx);
        for (const f of S.fish) { f.x += f.v * dt; if (f.x < -50) f.x = WW + 50; if (f.x > WW + 50) f.x = -50; }
        if (S.done) { S.endT += dt; if (S.endT > 2.4 && !this.finished) end(); }
      },
      draw(t, W, H) {
        screenFill(W, H, '#1d5f99', '#04142b');
        const v = mview(W, H); VIEW = null;
        S.camX = clamp(S.x - 480, 0, WW - 960); S.camY = clamp(S.y - 270, 0, WH - 540);
        cx.save(); cx.translate(-S.camX, -S.camY);
        // light rays
        for (let i = 0; i < 8; i++) { const x = i * 360 + Math.sin(t * 0.3 + i) * 40; const r = cx.createLinearGradient(0, 0, 0, 700); r.addColorStop(0, 'rgba(200,235,255,0.12)'); r.addColorStop(1, 'rgba(200,235,255,0)'); cx.fillStyle = r; cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x + 50, 0); cx.lineTo(x + 200, 700); cx.lineTo(x + 100, 700); cx.fill(); }
        // sea floor
        brick(-100, FLOORY, WW + 200, 140, '#d9b77e', true);
        for (const r of S.rocks) brick(r.x, FLOORY - r.h, r.w, r.h, r.c, true);
        for (const w of S.weeds) { cx.strokeStyle = '#3b9a52'; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(w.x, FLOORY); for (let k = 1; k <= w.h; k++) cx.lineTo(w.x + Math.sin(t * 1.4 + w.ph + k) * 6, FLOORY - k * 16); cx.stroke(); }
        // the wreck: bow and stern lying on the bottom
        const wreck = (x0, x1, tilt, bow) => {
          cx.save(); cx.translate((x0 + x1) / 2, FLOORY - 6); cx.rotate(tilt); const w = x1 - x0;
          brick(-w / 2, -150, w, 150, '#25282e', false); brick(-w / 2, -26, w, 26, '#d0302a', false); brick(-w / 2, -158, w, 10, '#e2c693', true);
          for (let r = 0; r < 3; r++) for (let x = -w / 2 + 20; x < w / 2 - 10; x += 34) { cx.fillStyle = 'rgba(120,150,170,0.5)'; circle(x, -120 + r * 32, 6); cx.fill(); }
          cx.fillStyle = '#c47a1e'; cx.fillRect(bow ? w * 0.1 : -w * 0.3, -230, 52, 72); cx.fillStyle = '#1c1c1c'; cx.fillRect(bow ? w * 0.1 : -w * 0.3, -230, 52, 16);
          cx.fillStyle = '#3a3d42'; for (let y = -150; y < 0; y += 18) cx.fillRect(bow ? w / 2 - 6 : -w / 2 - 6, y, 12 + Math.sin(y) * 8, 14);
          cx.restore();
        };
        wreck(380, 1260, -0.03, false); wreck(1420, 2260, 0.05, true);
        // treasures
        for (const o of T) if (!o.got && !(S.arm && S.arm.o === o && S.arm.phase !== 'out')) { const s = 1.1 + Math.sin(t * 3 + o.ph) * 0.1; glow(o.x, o.y, 60, 'rgba(255,230,120,A)', 0.35 + 0.2 * Math.sin(t * 4 + o.ph)); drawTreasure(o, o.x, o.y, s); cx.fillStyle = '#fff6c2'; drawSpark(o.x + 18, o.y - 20, 4 + 2 * Math.sin(t * 7 + o.ph)); }
        // fish
        for (const f of S.fish) drawFish2D(f.x, f.y + Math.sin(t * 2 + f.x) * 6, 38, f.k, Math.sign(f.v), t, f.x);
        for (const k of S.sharks) drawShark2D(k.x, k.y, k.face, t, k.chase);
        // the submarine
        if (S.hurt > 0 && Math.sin(t * 30) > 0) cx.globalAlpha = 0.4;
        cx.save(); cx.translate(S.x, S.y); cx.scale(S.face, 1);
        cx.fillStyle = 'rgba(255,240,180,0.18)'; cx.beginPath(); cx.moveTo(44, 0); cx.lineTo(260, -90); cx.lineTo(260, 90); cx.fill();
        cx.fillStyle = '#f2cd37'; rr(-50, -28, 100, 56, 28); cx.fill(); cx.fillStyle = '#d9a52b'; rr(-50, 10, 100, 18, 9); cx.fill();
        brick(-14, -44, 34, 18, '#f2cd37', true);
        cx.fillStyle = '#9fd3f0'; circle(18, -4, 16); cx.fill(); cx.strokeStyle = '#8d99a6'; cx.lineWidth = 4; circle(18, -4, 16); cx.stroke();
        cx.save(); cx.beginPath(); cx.arc(18, -4, 13, 0, Math.PI * 2); cx.clip(); cx.drawImage(faceCanvas(prefs.face), 6, -16, 24, 24); cx.restore();
        cx.fillStyle = '#4a4f57'; cx.fillRect(-62, -6, 12, 12); const pr = Math.sin(t * 20) * 14; cx.fillRect(-68, -pr / 2, 5, Math.abs(pr) + 2);
        cx.fillStyle = '#5b6470'; rr(22, 22, 20, 14, 4); cx.fill(); // claw mount
        cx.restore(); cx.globalAlpha = 1;
        drawClaw(S, clawTip(), t);
        // bubbles
        for (let i = 0; i < 10; i++) { const k = (t * 0.6 + i / 10) % 1; cx.fillStyle = `rgba(220,240,255,${0.5 * (1 - k)})`; circle(S.x - S.face * 50 + Math.sin(i * 3 + t) * 8, S.y - k * 120, 3 + (i % 3)); cx.fill(); }
        const o = near(); if (o) { cx.save(); cx.translate(o.x, o.y - 44); prompt(0, 0, 'search'); cx.restore(); }
        drawPops(S.pops, 1 / 60);
        cx.restore();
        // darkness around the submarine's light
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const px = v.ox + (S.x - S.camX) * v.s, py = v.oy + (S.y - S.camY) * v.s;
        const dk = cx.createRadialGradient(px, py, 120 * v.s, px, py, 520 * v.s); dk.addColorStop(0, 'rgba(2,8,20,0)'); dk.addColorStop(1, 'rgba(2,8,20,0.72)');
        cx.fillStyle = dk; cx.fillRect(0, 0, W, H);
        // found list
        const slotW = 54, sx0 = W - 20 - slotW * 5, sy0 = isTouch ? 124 : H - 74;
        cx.fillStyle = 'rgba(9,18,40,0.82)'; rr(sx0 - 10, sy0 - 10, slotW * 5 + 20, 64, 16); cx.fill();
        T.forEach((o2, i) => { const x = sx0 + i * slotW + slotW / 2, y = sy0 + 22; cx.fillStyle = 'rgba(255,255,255,0.08)'; circle(x, y, 22); cx.fill(); cx.globalAlpha = o2.got ? 1 : 0.25; drawTreasure(o2, x, y, 0.9); cx.globalAlpha = 1; });
        miniHud(`Treasure ${T.filter(o2 => o2.got).length}/5   Hull ${'♥'.repeat(Math.max(0, S.hp))}${'♡'.repeat(3 - Math.max(0, S.hp))}`, W);
      },
    };
  },
};

function drawShark2D(x, y, face, t, angry) {
  cx.save(); cx.translate(x, y); cx.scale(face, 1);
  const sw = Math.sin(t * (angry ? 10 : 5)) * 0.25;
  cx.fillStyle = 'rgba(0,10,25,0.2)'; cx.beginPath(); cx.ellipse(0, 46, 70, 8, 0, 0, Math.PI * 2); cx.fill();
  cx.save(); cx.translate(-62, 0); cx.rotate(sw); cx.fillStyle = '#5c6e80'; cx.beginPath(); cx.moveTo(6, 0); cx.lineTo(-30, -32); cx.lineTo(-20, 0); cx.lineTo(-30, 28); cx.closePath(); cx.fill(); cx.restore();
  cx.fillStyle = '#5c6e80'; cx.beginPath(); cx.moveTo(-14, -18); cx.lineTo(4, -50); cx.lineTo(18, -18); cx.fill();
  const g = cx.createLinearGradient(0, -24, 0, 24); g.addColorStop(0, '#7f93a6'); g.addColorStop(0.55, '#6b7f92'); g.addColorStop(0.56, '#e8eef3'); g.addColorStop(1, '#d3dde5');
  cx.fillStyle = g; cx.beginPath(); cx.moveTo(78, 2); cx.quadraticCurveTo(60, -26, 0, -24); cx.quadraticCurveTo(-50, -20, -66, 0); cx.quadraticCurveTo(-50, 18, 0, 22); cx.quadraticCurveTo(60, 22, 78, 2); cx.fill();
  cx.fillStyle = '#5c6e80'; cx.beginPath(); cx.moveTo(10, 12); cx.lineTo(-10, 36); cx.lineTo(24, 16); cx.fill();
  cx.strokeStyle = 'rgba(40,55,70,0.5)'; cx.lineWidth = 2; for (const gx of [30, 37, 44]) { cx.beginPath(); cx.moveTo(gx, -10); cx.lineTo(gx - 3, 6); cx.stroke(); }
  cx.fillStyle = '#111'; circle(58, -6, 3.6); cx.fill(); cx.fillStyle = '#fff'; circle(59, -7, 1.2); cx.fill();
  if (angry) { cx.strokeStyle = '#111'; cx.lineWidth = 2.5; line(52, -14, 64, -10); }
  cx.fillStyle = '#7a2230'; cx.beginPath(); cx.moveTo(48, 8); cx.quadraticCurveTo(62, angry ? 20 : 12, 74, 6); cx.closePath(); cx.fill();
  cx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { cx.beginPath(); cx.moveTo(52 + i * 5, 8); cx.lineTo(54.5 + i * 5, 12); cx.lineTo(57 + i * 5, 7.5); cx.fill(); }
  cx.restore();
  if (angry) { cx.fillStyle = '#e5484d'; cx.font = `700 26px ${FONT}`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('!', x, y - 56); }
}
function drawClaw(S, tip, t) { // a two-joint arm with gripping pincers
  const bx = S.x + S.face * 32, by = S.y + 30, A = S.arm;
  const dx = tip.x - bx, dy = tip.y - by, len = Math.hypot(dx, dy) || 1;
  const elbow = { x: bx + dx / 2 - (dy / len) * Math.min(26, len * 0.3) * S.face, y: by + dy / 2 + (dx / len) * Math.min(26, len * 0.3) * S.face };
  cx.lineCap = 'round';
  for (const [a, b] of [[{ x: bx, y: by }, elbow], [elbow, tip]]) {
    cx.strokeStyle = '#4a4f57'; cx.lineWidth = 10; line(a.x, a.y, b.x, b.y);
    cx.strokeStyle = '#8d99a6'; cx.lineWidth = 6; line(a.x, a.y, b.x, b.y);
  }
  for (const p of [{ x: bx, y: by }, elbow]) { cx.fillStyle = '#f2cd37'; circle(p.x, p.y, 7); cx.fill(); cx.fillStyle = '#4a4f57'; circle(p.x, p.y, 3); cx.fill(); }
  const ang = Math.atan2(dy, dx), open = A ? (A.phase === 'out' ? 0.75 : 0.75 - A.grip * 0.65) : 0.25 + Math.sin(t * 2) * 0.05;
  cx.save(); cx.translate(tip.x, tip.y); cx.rotate(ang);
  // a carried treasure sits between the pincers
  if (A && A.phase !== 'out') { cx.save(); cx.rotate(-ang); MG.drawT(A.o, Math.cos(ang) * 16, Math.sin(ang) * 16, 0.8); cx.restore(); }
  for (const sgn of [-1, 1]) {
    cx.save(); cx.rotate(sgn * open);
    cx.fillStyle = '#5b6470'; cx.beginPath(); cx.moveTo(0, -4 * sgn); cx.lineTo(20, -4 * sgn); cx.lineTo(28, 4 * sgn); cx.lineTo(22, 6 * sgn); cx.lineTo(16, 2 * sgn); cx.lineTo(0, 4 * sgn); cx.fill();
    cx.restore();
  }
  cx.fillStyle = '#f2cd37'; circle(0, 0, 6); cx.fill();
  cx.restore();
}

// ---------- Guide it down, drawn in 2D (when 3D isn't available) ----------
function drawDive2D(now) {
  const t = now / 1000, W = innerWidth, H = innerHeight, D = G.dive, k = Math.min(W / 140, H / 60);
  screenFill(W, H, '#2f7fbf', '#06203f');
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); VIEW = null;
  const sx = x => W / 2 + x * k, sy = y => H * 0.42 - (y - D.y) * k;
  for (let i = 0; i < 6; i++) { const x = W * (0.1 + i * 0.17) + Math.sin(t * 0.3 + i) * 30; cx.fillStyle = 'rgba(200,235,255,0.08)'; cx.beginPath(); cx.moveTo(x - 30, 0); cx.lineTo(x + 30, 0); cx.lineTo(x + 140, H); cx.lineTo(x + 40, H); cx.fill(); }
  const fy = sy(DIVE.floor);
  if (fy < H) { cx.fillStyle = '#d9b77e'; cx.fillRect(0, fy, W, H - fy); cx.fillStyle = 'rgba(255,224,102,0.8)'; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; circle(sx(D.landX) + Math.cos(a) * 9 * k, fy + 6 + Math.sin(a) * 2, 4); cx.fill(); } }
  for (const r of D.rows) for (const f of r.fish) {
    let x, y;
    if (f.bumped) { const q = D.t - f.bt; if (q > 2) continue; x = f.bx + f.bvx * q; y = f.by + q * 9; } else { x = fishX(r, f, D.t); y = r.y; if (Math.abs(x) > DIVE.half + 6) continue; }
    cx.save(); cx.translate(sx(x), sy(y)); if (f.bumped) cx.rotate((D.t - f.bt) * 8); drawFish2D(0, 0, 2.4 * k, r.kind, r.dir, t, f.off); cx.restore();
  }
  cx.save(); cx.translate(sx(D.x), sy(D.y)); cx.rotate(-(0.1 + Math.sin(t * 1.2) * 0.04)); cx.scale(k, k);
  cx.fillStyle = '#25282e'; cx.fillRect(-13, -5, 26, 9); cx.fillStyle = '#d0302a'; cx.fillRect(-13, 2.5, 26, 2); cx.fillStyle = '#e2c693'; cx.fillRect(-13, -5.6, 26, 1);
  cx.fillStyle = '#f5a623'; cx.fillRect(-6, -10, 2.6, 4.5); cx.fillRect(1, -10, 2.6, 4.5);
  cx.fillStyle = '#ffe1a0'; for (let x = -11; x < 12; x += 2.2) cx.fillRect(x, -2.5, 0.8, 0.8);
  cx.restore();
  if (D.t < 6 && !D.landed) { cx.fillStyle = 'rgba(9,18,40,0.85)'; rr(W / 2 - 70, sy(D.y + 10) - 22, 140, 30, 15); cx.fill(); cx.fillStyle = '#fff'; cx.font = `600 14px ${FONT}`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(isTouch ? '◀ ▶ to steer' : '← → to steer', W / 2, sy(D.y + 10) - 7); }
  vignette(W, H);
}

// ---------- 3D: the puppy hat and lifeboat flag ----------
function addDogHat3D(dog) {
  if (!souv.dogHat) return;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.85, 14), M('#ef7b8b')); cone.position.set(1.05, 2.4, 0); cone.castShadow = true; dog.body.add(cone);
  const pom = mesh(R3.geo.ball, M('#f2cd37'), dog.body, 1.05, 2.86, 0); pom.scale.setScalar(0.13);
}
function addFlag3D(boat) {
  if (!souv.flag) return;
  box(0.14, 3.6, 0.14, '#8a5a30', -3.2, 3.9, 0, boat);
  box(1.6, 1.0, 0.06, '#c91a09', -2.35, 5.15, 0, boat); box(1.6, 0.22, 0.07, '#ffffff', -2.35, 5.15, 0, boat);
}

function viewState() { return state === 'paused' && pausedFrom ? pausedFrom : state; } // what to show behind the pause screen
function finishEscape() {
  if (G && G.mode) { showScreen('win'); return; }
  if (G && G.rescued === undefined && !G.swim) { startRescue(); return; } // row around and pick people up first
  if (use3D && prefs.ending) startEnding(); else showScreen('win');
}
function startRescue() {
  MG = MINIS.rescue(true); MG.id = 'rescue'; MG.t = 0;
  state = 'mini'; document.body.classList.add('mini'); warnEl.style.display = 'none';
  for (const k in input) input[k] = false;
  msg(MG.intro, 5, MG.icon);
}
function draw(now) {
  if (MG) { cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight); MG.draw(now / 1000, innerWidth, innerHeight); return; }
  if (use3D) draw3D(now);
  else if (G && G.dive && viewState() === 'dive') drawDive2D(now);
  else drawClassic(now);
}
function start3D() {
  if (use3D) return;
  try { use3D = init3D(); } catch (e) { console.warn('3D unavailable, using 2D', e); use3D = false; }
  if (use3D) { document.body.classList.add('three'); resize3D(); if (G) rebuild3D(); }
}
addEventListener('resize', () => resize3D());
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(start3D);

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw(now);
  if (photoPending) { photoPending = false; capturePhoto(); }
  requestAnimationFrame(frame);
}
showScreen('menu');
requestAnimationFrame(frame);
</script>
